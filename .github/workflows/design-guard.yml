name: Design preservation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:design
      - run: python3 scripts/build-app-runtime.py && git diff --exit-code -- app/index.html app/runtime-before-core.js app/runtime-after-core.js
