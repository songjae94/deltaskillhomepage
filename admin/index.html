function login(){el("screen").innerHTML=`<div class="pad"><div class="h">델타스킬 수학 진단</div>
 <div class="desc">모의고사 본 뒤 5분 자가진단으로, 나에게 맞는 학습 처방과 등급 상승 경로를 받아요. 휴대폰 번호로 시작하세요.</div>
 <div class="field"><label>휴대폰 번호</label><input class="txt" id="ph" inputmode="numeric" placeholder="01000000000" value="${S.phone}"></div></div>`;
 el("ph").oninput=e=>S.phone=e.target.value.replace(/[^0-9]/g,"");
 el("fab").innerHTML=`<button class="btn" id="go">시작하기</button>`;
 el("go").onclick=()=>{if(S.phone.length<10){alert("휴대폰 번호를 정확히 입력하세요");return;}
   const st=(LS.get("ds_students")||{})[S.phone];
   if(st){S.profile=st.profile;S.studentId=st.id;S.attempt=((LS.get("ds_subs")||[]).filter(x=>x.phone===S.phone).length)+1;S.screen="intro";}
   else{S.screen="signup";}render();window.scrollTo(0,0);};}

/* ---------- 가입 + 동의 ---------- */
function signup(){const p=S.profile||{name:"",academy:"",grade:"",subject:""};S._p=p;S._consent=S._consent||false;
 el("screen").innerHTML=`<div class="pad"><div class="h">가입 (최초 1회)</div><div class="desc">다음 주부터 같은 번호로 접속하면 이어서 기록돼요.</div>
 <div class="field"><label>이름</label><input class="txt" id="nm" placeholder="이름" value="${esc(p.name)}"></div>
 <div class="field"><label>학원명</label><input class="txt" id="ac" placeholder="예: OO독학재수학원 일산" value="${esc(p.academy)}"></div>
 <div class="field"><label>구분</label><div class="seg"><button data-g="재수생" class="${p.grade==='재수생'?'on':''}">재수생(N수)</button><button data-g="고3" class="${p.grade==='고3'?'on':''}">고3</button></div></div>
 <div class="field"><label>수학 선택과목</label><div class="seg"><button data-s="미적분" class="${p.subject==='미적분'?'on':''}">미적분</button><button data-s="확통" class="${p.subject==='확통'?'on':''}">확률과통계</button></div></div>
 <div class="field"><label>개인정보 수집·이용 동의 (만 19세 이상 본인 동의)</label>
   <div class="legalbox">델타스킬(가칭)은 수학 학습 진단 서비스 제공을 위해 아래 정보를 수집·이용합니다.<br>• 수집 항목: 이름, 휴대폰번호, 학원명, 학년, 선택과목, 모의고사 문항별 응답·정오·자가진단 데이터<br>• 이용 목적: 개인 맞춤 학습 진단·처방·경로 제공, 서비스 개선<br>• 보유 기간: 수집일로부터 서비스 종료 시 또는 동의 철회 시까지<br>• 동의를 거부할 수 있으나, 거부 시 진단 서비스 이용이 제한됩니다.<br>• 본인은 만 19세 이상이며 위 내용에 동의합니다.</div>
   <label class="consent ${S._consent?'on':''}" id="cs"><input type="checkbox" id="ck" ${S._consent?'checked':''}><span class="ct"><b>[필수]</b> 만 19세 이상이며 개인정보 수집·이용에 동의합니다.</span></label></div>
 </div>`;
 el("nm").oninput=e=>p.name=e.target.value;el("ac").oninput=e=>p.academy=e.target.value;
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{p.grade=b.dataset.g;render();});
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{p.subject=b.dataset.s;render();});
 el("ck").onchange=e=>{S._consent=e.target.checked;el("cs").classList.toggle("on",e.target.checked);el("done").disabled=!ok();};
 S.profile=p;
 function ok(){return p.name&&p.academy&&p.grade&&p.subject&&S._consent;}
 el("nm").addEventListener("input",()=>{el("done").disabled=!ok();});
 el("ac").addEventListener("input",()=>{el("done").disabled=!ok();});
 el("fab").innerHTML=`<button class="btn" id="done" ${ok()?"":"disabled"}>가입 완료 · 진단 시작</button>`;
 el("done").onclick=()=>{if(!ok())return;
   const all=LS.get("ds_students")||{};S.studentId=S.studentId||("stu_"+S.phone);
   all[S.phone]={id:S.studentId,phone:S.phone,profile:p,consent_at:new Date().toISOString()};LS.set("ds_students",all);
   S.attempt=((LS.get("ds_subs")||[]).filter(x=>x.phone===S.phone).length)+1;S.screen="intro";render();window.scrollTo(0,0);};}

/* ---------- 진단 인트로 ---------- */
function intro(){el("screen").innerHTML=`<div class="pad"><div class="h">${esc(S.profile.name)}님, 반가워요 👋</div>
 <div class="desc">${EXAM.title} 자가진단이에요 (${S.attempt}회차). 답을 입력하면 자동 채점되고, <b>틀린 이유</b>를 한 번씩 탭하면 나에게 맞는 처방이 나와요.</div>
 <div class="bar"><div class="pl"><span class="ic">📝</span><div>공통 22문항 + <b>${S.profile.subject}</b> 8문항</div></div>
 <div class="pl"><span class="ic">⏱️</span><div>약 5분 · 대부분 탭 한 번</div></div>
 <div class="pl"><span class="ic">🎯</span><div>끝나면 영역별 정답률 + 이번 주 처방을 바로 확인</div></div></div></div>`;
 el("fab").innerHTML=`<button class="btn" id="st">진단 시작</button>`;el("st").onclick=()=>{S.screen="quiz";render();window.scrollTo(0,0);};}

/* ---------- 진단 ---------- */
function card(q){const g=graded(q);
 let ansUI=q.fmt==="c"?`<div class="chips">`+CHIP.map(c=>`<button class="chip ${S.ans[q.no]===c?'on':''}" data-a="${c}">${c}</button>`).join("")+`</div>`:`<input class="numin" inputmode="numeric" placeholder="답 입력" value="${S.ans[q.no]??''}" data-num="1">`;
 let badge=g?`<span class="badge ${g}">${g==='o'?'정답':'오답'}</span>`:"";
 let diag=(S.ans[q.no]!=null&&S.ans[q.no]!=="")?`<div class="diag"><div class="dlab">${g==='x'?'왜 틀렸나요? (한 번 탭)':'확신도'}</div>${g==='x'?`<div class="rchips">`+REASONS.map(r=>`<span class="rchip ${S.reason[q.no]===r?'on':''}" data-r="${r}">${r}</span>`).join("")+`</div><input class="memo" placeholder="막힌 지점 한 줄 (선택)" value="${esc(S.memo[q.no])}" data-memo="1">`:`<div class="rchips">`+["확신함","애매함","찍음"].map(r=>`<span class="rchip ${S.conf[q.no]===r?'on':''}" data-c="${r}">${r}</span>`).join("")+`</div>`}</div>`:"";
 const d=document.createElement("div");d.className="q";d.innerHTML=`<div class="qh"><span class="qno">${q.no}</span><span class="qmeta"><b>${q.unit}</b> · ${q.topic} · ${q.jum}점 · ${q.fmt==='c'?'객관식':'단답'}</span>${badge}</div>${ansUI}${diag}`;
 d.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.ans[q.no]=b.dataset.a;refresh();});
 const num=d.querySelector("[data-num]");if(num){num.oninput=e=>{S.ans[q.no]=e.target.value.trim();};num.onblur=()=>refresh();}
 d.querySelectorAll("[data-r]").forEach(c=>c.onclick=()=>{S.reason[q.no]=c.dataset.r;refresh();});
 d.querySelectorAll("[data-c]").forEach(c=>c.onclick=()=>{S.conf[q.no]=c.dataset.c;refresh();});
 const m=d.querySelector("[data-memo]");if(m)m.oninput=e=>S.memo[q.no]=e.target.value;return d;}
function refresh(){const y=window.scrollY;quiz();window.scrollTo(0,y);setProg();updFab();}
function quiz(){const wrap=document.createElement("div");wrap.className="pad";
 wrap.innerHTML=`<div class="h" style="font-size:16px">답을 입력하세요</div><div class="desc">객관식은 번호 탭, 단답은 숫자 입력. 채점은 자동이에요.</div><div class="sechd">공통과목 (1–22)</div>`;
 const g1=document.createElement("div");DATA.gong.forEach(q=>g1.appendChild(card(q)));wrap.appendChild(g1);
 wrap.insertAdjacentHTML("beforeend",`<div class="sechd">선택과목 · ${S.profile.subject} (23–30)</div>`);
 const g2=document.createElement("div");(S.profile.subject==="미적분"?DATA.mi:DATA.hw).forEach(q=>g2.appendChild(card(q)));wrap.appendChild(g2);
 el("screen").innerHTML="";el("screen").appendChild(wrap);updFab();}
function updFab(){const n=answeredCount();el("fab").innerHTML=`<button class="btn" id="sub" ${n>=1?"":"disabled"}>제출하고 진단 보기 (${n}/30)</button>`;if(n>=1)el("sub").onclick=submitDiag;}

async function submitDiag(){el("sub").disabled=true;el("sub").textContent="저장 중...";
 const res=buildResult();let mode="demo";
 try{ mode=await saveAll(res); }catch(e){ mode="error:"+(e&&e.message||e); }
 S.saveMode=mode;S.screen="result";render();window.scrollTo(0,0);}

function buildResult(){const its=items().filter(q=>graded(q)!=null);
 const correct=its.filter(q=>graded(q)==="o");const score=correct.reduce((s,q)=>s+q.jum,0);
 return {score,total:its.length,correct:correct.length,
   responses:its.map(q=>({item_no:q.no,area:q.area,unit:q.unit,my_answer:""+S.ans[q.no],correct_answer:""+q.ans,result:graded(q),reason:S.reason[q.no]||null,confidence:S.conf[q.no]||null,memo:S.memo[q.no]||null}))};}

async function sbPost(table,body,upsert){const r=await fetch(`${CONFIG.url}/rest/v1/${table}${upsert?"?on_conflict=id":""}`,{method:"POST",headers:{apikey:CONFIG.key,Authorization:"Bearer "+CONFIG.key,"Content-Type":"application/json",Prefer:"return=minimal"+(upsert?",resolution=merge-duplicates":"")},body:JSON.stringify(body)});if(!r.ok)throw new Error(table+" HTTP "+r.status);}
async function saveAll(res){
 if(CONFIG.url&&CONFIG.key){
   /* select 권한 없이도 동작하도록 ID를 클라이언트에서 생성 (return=minimal) */
   const ids=LS.get("ds_ids")||{};const sid=ids[S.phone]||uid();ids[S.phone]=sid;LS.set("ds_ids",ids);S.studentId=sid;
   await sbPost("students",{id:sid,phone:S.phone,name:S.profile.name,academy:S.profile.academy,grade:S.profile.grade,subject:S.profile.subject,consent:true},true);
   const subId=uid();
   await sbPost("submissions",{id:subId,student_id:sid,exam_code:EXAM.code,attempt_no:S.attempt,score:res.score});
   await sbPost("responses",res.responses.map(x=>({...x,submission_id:subId})));
   const subs=LS.get("ds_subs")||[];subs.push({phone:S.phone,exam:EXAM.code,attempt:S.attempt,score:res.score,mode:"server"});LS.set("ds_subs",subs);
   return "server";
 } else {
   const subs=LS.get("ds_subs")||[];subs.push({phone:S.phone,exam:EXAM.code,attempt:S.attempt,score:res.score,mode:"demo",responses:res.responses});LS.set("ds_subs",subs);
   return "demo";
 }}

/* ---------- 결과 ---------- */
function pathLocked(){const on=Math.min(S.attempt,3);return `<div class="lock"><div class="lg">🗺️</div><h4>학습 경로는 ${3-on>0?`${3-on}회 더 응시하면`:'곧'} 열려요</h4><p>한 번의 시험은 그날 컨디션이 섞여요. 3회가 쌓이면 <b>반복되는 결손</b>만 골라 개인 학습 경로를 만들어드려요.</p><div class="dots">${[0,1,2].map(i=>`<i class="${i<on?'on':''}"></i>`).join("")}</div><div style="font-size:12px;color:#8a6d3b;margin-bottom:12px">현재 ${on}/3회</div><button class="btn ghost" id="pv" style="max-width:280px;margin:0 auto">3회 누적됐다고 가정하고 미리보기</button></div>`;}
function pathUnlocked(weak){const steps=weak.map(w=>w[0]).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));const body=steps.map((u,i)=>{const b=BANK[u]||{};return `<div class="step"><div class="stepn">${i+1}</div><div><div class="st"><b>${u}</b></div><div class="stt">${b.up?'⬆️ 상류 먼저 · ':''}${b.type||''}</div></div></div>`;}).join("");return `<div class="bar"><div style="font-size:12px;color:#16a34a;font-weight:700;margin-bottom:4px">✓ 3회 누적 가정 · 반복 결손 기준</div><h4 style="margin-bottom:4px">${esc(S.profile.name)}님 학습 경로</h4><div style="font-size:12px;color:var(--mut);margin-bottom:8px">상류(기초)부터 순서대로 — 이 순서로 메우면 등급이 가장 빠르게 올라가요.</div>${body||'<div class="stt">약점이 뚜렷하지 않아요 — 유지 학습!</div>'}<div style="font-size:11px;color:var(--mut);margin-top:10px">* 예시 화면. 실제로는 여러 주간 반복 결손으로 자동 생성·매주 갱신됩니다.</div></div>`;}
function result(){const its=items();const done=its.filter(q=>graded(q)!=null);const correct=done.filter(q=>graded(q)==="o");const score=correct.reduce((s,q)=>s+q.jum,0);
 const areas={};its.forEach(q=>{const g=graded(q);if(g==null)return;areas[q.area]=areas[q.area]||{o:0,n:0};areas[q.area].n++;if(g==="o")areas[q.area].o++;});
 const areaRows=Object.entries(areas).map(([k,v])=>{const p=Math.round(v.o/v.n*100);const col=p>=70?"#16a34a":p>=45?"#f59e0b":"#e11d48";return `<div class="row"><span class="nm">${k}</span><span class="tr"><i style="width:${p}%;background:${col}"></i></span><span class="pc">${p}%</span></div>`;}).join("");
 const uinfo={};its.forEach(q=>{const g=graded(q);if(g==null)return;const u=uinfo[q.unit]=uinfo[q.unit]||{n:0,wrong:[],reasons:{}};u.n++;if(g==="x"){u.wrong.push(q.no);const r=S.reason[q.no];if(r)u.reasons[r]=(u.reasons[r]||0)+1;}});
 const weak=Object.entries(uinfo).filter(([k,v])=>v.wrong.length>0).sort((a,b)=>(b[1].wrong.length-a[1].wrong.length)||(ORDER.indexOf(a[0])-ORDER.indexOf(b[0]))).slice(0,3);
 const presc=weak.map(([u,v])=>{const tr=Object.entries(v.reasons).sort((a,b)=>b[1]-a[1])[0];const rl=tr?tr[0]:null;const fix=rl?REASONFIX[rl]:"유형별 대표문항으로 감 잡기";const b=BANK[u]||{type:u,gichul:[]};return `<div class="presc"><div class="pu">${u}<span class="pw">${v.wrong.length}문항 틀림</span></div>${rl?`<div class="pr">주 원인: <b>${rl}</b></div>`:''}<div class="pl"><span class="ic">🎯</span><div><b>유형 학습</b> · ${b.type}<br>→ ${fix}</div></div><div class="pl"><span class="ic">🔁</span><div><b>이번 시험 다시 풀 문제</b><br>${EXAM.title} ${v.wrong.map(n=>n+'번').join(', ')}</div></div><div class="pl"><span class="ic">📚</span><div><b>기출 복습</b><br>${b.gichul.join(' / ')}</div></div>${b.up?`<div class="pl up"><span class="ic">⬆️</span><div><b>먼저 볼 것(상류 결손)</b><br>${b.up}</div></div>`:''}</div>`;}).join("")||`<div class="presc"><div class="pl"><span class="ic">🎉</span><div>틀린 문항이 거의 없어요! 유지 학습으로 충분해요.</div></div></div>`;
 const savedUI=S.saveMode==="server"?`<div class="saved">✅ 델타스킬 서버에 저장됐어요 · 매주 쌓여 학습 경로가 됩니다</div>`:(S.saveMode&&S.saveMode.startsWith("error")?`<div class="saved demo">⚠ 서버 저장 실패(${S.saveMode}) — 브라우저에 임시 저장됨. 관리자에게 문의</div>`:`<div class="saved demo">💾 저장 완료(데모=브라우저) · 서버 키를 넣으면 델타스킬 DB로 저장됩니다</div>`);
 const pathSec=S.previewPath?pathUnlocked(weak):pathLocked();
 el("screen").innerHTML=`<div class="pad">${savedUI}<div class="h">${esc(S.profile.name)}님 진단 결과</div><div class="desc">${EXAM.title} · ${S.profile.subject} · ${S.attempt}회차</div>
  <div class="kpirow"><div class="kpi"><div class="v">${score}<span style="font-size:13px;color:#6b7280">점</span></div><div class="l">자기채점 원점수 (100)</div></div><div class="kpi"><div class="v">${correct.length}<span style="font-size:13px;color:#6b7280">/${done.length}</span></div><div class="l">맞은 문항</div></div></div>
  <div class="bar"><h4>영역별 정답률</h4>${areaRows}</div>
  <div class="seclabel">📌 이번 주 나의 처방</div>${presc}
  <div class="seclabel">🗺️ 나의 학습 경로</div>${pathSec}
  <div class="note">파일럿 · deltaskill.co.kr</div></div>`;
 const pv=el("pv");if(pv)pv.onclick=()=>{S.previewPath=true;result();window.scrollTo(0,el("screen").scrollHeight);};
 el("fab").innerHTML=`<button class="btn ghost" id="home">완료 · 처음으로</button>`;el("home").onclick=()=>{S={screen:"login",phone:"",profile:null,studentId:null,ans:{},reason:{},conf:{},memo:{},previewPath:false,attempt:1,saveMode:null};render();window.scrollTo(0,0);};}
render();
</script></body></html>
