<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>델타스킬 관리자</title>
<style>
:root{--red:#c00}
*{box-sizing:border-box}
body{font-family:'Malgun Gothic',Pretendard,sans-serif;margin:0;color:#1a1a1a;line-height:1.55;background:#fafafa}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px}
h1{font-size:20px;border-bottom:3px solid var(--red);padding-bottom:8px;margin:6px 0 14px}
h2{font-size:15px;margin:24px 0 8px;border-left:4px solid var(--red);padding-left:8px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0;background:#fff}
th,td{border:1px solid #ddd;padding:5px 8px;text-align:left}
th{background:#f6f6f6}
tr.click{cursor:pointer} tr.click:hover td{background:#fff5f5}
.k{color:#777;font-size:12px}
.cand{display:inline-block;font-size:10px;font-weight:700;color:#06c;border:1px solid #9cc4ec;border-radius:999px;padding:0 6px;white-space:nowrap}
.bad{color:var(--red);font-weight:600}.warn{background:#fff3cd}
.bar{display:inline-block;height:10px;background:var(--red);vertical-align:middle}
.gray{display:inline-block;height:10px;background:#bbb;vertical-align:middle}
.tag{display:inline-block;background:#eee;border-radius:4px;padding:1px 7px;font-size:12px;margin:1px}
.note{background:#f8f8f8;border:1px solid #e5e5e5;border-radius:6px;padding:10px 12px;font-size:13px}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:10px 16px;min-width:120px}
.card b{font-size:20px;display:block}
button{font:inherit;padding:7px 14px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
button.p{background:var(--red);border-color:var(--red);color:#fff}
input{font:inherit;padding:7px 10px;border:1px solid #ccc;border-radius:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:24px}
#login input{width:100%;margin:5px 0}
.err{color:var(--red);font-size:13px;min-height:18px}
.top{display:flex;justify-content:space-between;align-items:center}
button.sel{background:var(--red);border-color:var(--red);color:#fff}
select{font:inherit;padding:6px 10px;border:1px solid #ccc;border-radius:6px;background:#fff}
label.chk{display:inline-flex;align-items:center;gap:4px;font-size:13px;border:1px solid #ddd;border-radius:6px;padding:4px 9px;background:#fff;cursor:pointer}
label.chk input{width:auto;margin:0;padding:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
@media print{.noprint{display:none}body{background:#fff}.wrap{max-width:100%}}
</style>
</head>
<body>

<div id="login" hidden>
  <h1>델타스킬 관리자</h1>
  <p class="k">파일럿 관리자 페이지입니다. 계정은 운영자에게 문의하십시오.</p>
  <input id="lid" placeholder="아이디" autocomplete="username">
  <input id="lpw" placeholder="비밀번호" type="password" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="p" style="width:100%" onclick="doLogin()">로그인</button>
</div>

<div id="app" class="wrap" hidden>
  <div class="top">
    <h1 id="title">델타스킬 관리자</h1>
    <div class="noprint row">
      <button onclick="show('main')" id="backBtn" hidden>← 목록</button>
      <button onclick="openCohort()" id="cohortBtn" hidden>반별 현황</button>
      <button onclick="window.print()" id="printBtn" hidden>인쇄 / PDF</button>
      <button onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <p class="k">이 화면의 자료는 상담·관리 목적입니다. 화면·출력물을 외부에 공유하지 마십시오 (개인정보 포함).</p>
  <div id="main"></div>
  <div id="detail" hidden></div>
  <div id="cohort" hidden></div>
</div>

<script>
const API = "https://cvlrphtupjmaefahodgz.supabase.co/functions/v1/admin-api";
const DEMO = new URLSearchParams(location.search).has("demo");
const TK = {
  get: () => sessionStorage.getItem("ds_admin_tk"),
  set: t => sessionStorage.setItem("ds_admin_tk", t),
  clear: () => sessionStorage.removeItem("ds_admin_tk"),
};
let CACHE = null;   // students 응답
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (n, d) => d ? Math.round(100 * n / d) + "%" : "-";

// ── 문항별 요구 스킬 (계류) — 오답 옆에 "이 문항이 쓰는 스킬"을 띄운다.
//    DELTAMAP[시험코드][트랙][번호] = {uses:[기본 풀이가 쓰는 스킬], anchors:[지름길]}
//    자동 생성 블록 — 회차 추가 시 admin/exam_item_skills.gen.json 재생성 후 교체.
/* 요구 스킬 — /deltamap.json 하나에서 불러온다. 회차 추가 시 그 파일만 교체
   (2026-08-12 개명: 예전 이름이 skills.json 이었다. 지금 skills.json 은 존재하지 않는다) */
let DELTAMAP = {};
const deltamapReady = fetch("/deltamap.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{DELTAMAP=d;}).catch(()=>{});
// 응답의 area(수학Ⅰ/Ⅱ·미적분(선택)·확률과통계)를 계류 트랙 키로 옮긴다.
const AREA2TRACK = {"수학Ⅰ":"공통","수학Ⅱ":"공통","공통":"공통","미적분(선택)":"미적분","미적분":"미적분","확률과통계":"확통","확률과 통계":"확통","확통":"확통","기하":"기하"};
function skillsOf(exam, area, no){
  const E = DELTAMAP[exam]; if(!E) return null;
  const n = +no;
  if(n>=1 && n<=22 && E["공통"] && E["공통"][no]) return E["공통"][no];  // 공통 1~22 번호 유일
  const tr = AREA2TRACK[area] || area;                                    // 선택 23~30 은 트랙으로 갈림
  return (E[tr] && E[tr][no]) || null;
}
/* uses·anchors 는 문자열이거나 {skill,step} 객체다. 객체를 그대로 esc 하면 [object Object] 가 찍힌다 */
function useName(u){ return typeof u === "string" ? u : ((u && u.skill) || ""); }
function skillCell(exam, area, no){
  const s = skillsOf(exam, area, no);
  if(!s) return "<span class='k'>-</span>";
  const as = (s.anchors || []).map(useName).filter(Boolean);
  const us = (s.uses || []).map(useName).filter(Boolean);
  if(!as.length && !us.length) return "<span class='k'>-</span>";
  const p = [];
  /* COST ○강 = 알맞은 도구를 쓰면 풀이가 크게 줄어드는 문항 → 교재 스킬로 뽑을 후보 */
  if(s.cand) p.push(`<span class="cand" title="COST ○강 — 도구를 알면 풀이가 크게 줄어드는 문항. 교재 스킬 후보">스킬 후보</span>`);
  if(as.length) p.push(as.map(a=>`<b title="지름길(계류) — 기본 풀이보다 빠른 길">⚡ ${esc(a)}</b>`).join("<br>"));
  if(us.length) p.push("<span class='k'>" + us.map(esc).join(" · ") + "</span>");
  return p.join("<br>");
}

async function api(body) {
  if (DEMO) return demoApi(body);
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...body, token: TK.get() }) });
  const j = await r.json().catch(() => null);
  if (r.status === 401 && body.action !== "login") { TK.clear(); boot(); throw new Error("auth"); }
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.error) || ("HTTP " + r.status));
  return j;
}

// ── 로그인 ─────────────────────────────────────────
async function doLogin() {
  document.getElementById("lerr").textContent = "";
  try {
    const j = await api({ action: "login",
      login_id: document.getElementById("lid").value.trim(),
      pw: document.getElementById("lpw").value });
    TK.set(j.token); boot();
  } catch (e) {
    document.getElementById("lerr").textContent =
      e.message === "too_many" ? "시도가 너무 잦습니다. 잠시 후 다시." : "아이디 또는 비밀번호가 맞지 않습니다.";
  }
}
async function doLogout() { try { await api({ action: "logout" }); } catch (_) {} TK.clear(); location.reload(); }

// ── 화면 전환 ──────────────────────────────────────
function show(which) {
  document.getElementById("main").hidden = which !== "main";
  document.getElementById("detail").hidden = which !== "detail";
  document.getElementById("cohort").hidden = which !== "cohort";
  document.getElementById("backBtn").hidden = which === "main";
  document.getElementById("printBtn").hidden = which === "main";
  document.getElementById("cohortBtn").hidden = which !== "main";
  if (which === "main") document.getElementById("title").textContent = "델타스킬 관리자";
}

// ── 목록 화면 ──────────────────────────────────────
function mergeByPhone(students) {
  const by = {};
  for (const s of students) { (by[s.phone || "?"] = by[s.phone || "?"] || []).push(s); }
  return Object.values(by).map(rs => {
    rs.sort((a, b) => (a.created_at || "").localeCompare(b.created_at || ""));
    return { ...rs[0], ids: rs.map(x => x.id) };
  });
}

async function loadMain() {
  const j = await api({ action: "students" });
  CACHE = j;
  const studs = mergeByPhone(j.students);
  const nSub = {};
  let last7 = 0;
  const week = Date.now() - 7 * 864e5;
  for (const s of j.submissions) {
    nSub[s.student_id] = (nSub[s.student_id] || 0) + 1;
    if (new Date(s.created_at) > week) last7++;
  }
  const cnt = st => st.ids.reduce((a, i) => a + (nSub[i] || 0), 0);
  const noSub = studs.filter(s => cnt(s) === 0).length;
  const pc = j.photoCounts || {};
  const photoOf = st => st.ids.reduce((a, i) => a + (pc[i] || 0), 0);

  // 성실도 배지 — 누적 제출 횟수로. 반복·누적이 델타스킬의 핵심이라 그걸 보상한다.
  const tier = n => n >= 10 ? { m: "👑", t: "마스터", c: "#8a6d00" }
    : n >= 5 ? { m: "🔥", t: "열공", c: "#c00" }
    : n >= 3 ? { m: "⭐", t: "성실", c: "#c67" }
    : n >= 1 ? { m: "🌱", t: "새싹", c: "#690" } : null;
  const reward = studs.filter(s => cnt(s) >= 3).length;   // 보상 대상(3회 이상)

  const scope = j.role === "academy" ? ` — ${esc(j.academy)}` : "";
  document.getElementById("title").textContent = "델타스킬 관리자" + scope;

  let h = `<div class="cards">
    <div class="card"><b>${studs.length}</b>가입 학생</div>
    <div class="card"><b>${j.submissions.length}</b>누적 제출</div>
    <div class="card"><b>${last7}</b>이번 주 제출</div>
    <div class="card"><b class="${noSub ? "bad" : ""}">${noSub}</b>가입만 하고 미제출</div>
    <div class="card"><b style="color:#c00">${reward}</b>보상 대상(3회+)</div>
  </div>
  <div class="row noprint"><input id="q" placeholder="이름·연락처·학원 검색" style="flex:1"
    oninput="filterRows()">
    <label class="k"><input type="checkbox" id="onlyReward" onchange="filterRows()"> 보상 대상만</label></div>
  <table id="tbl"><tr><th>이름</th><th>등급</th><th>연락처</th><th>소속</th><th>구분</th><th>선택</th><th>가입일</th><th>제출</th><th>사진</th></tr>`;
  for (const s of studs.sort((a, b) => cnt(b) - cnt(a) || (b.created_at || "").localeCompare(a.created_at || ""))) {
    const n = cnt(s), tg = tier(n), np = photoOf(s);
    h += `<tr class="click" data-t="${esc((s.name || "") + (s.phone || "") + (s.academy || ""))}" data-n="${n}"
      onclick="loadDetail('${esc(s.phone)}')">
      <td>${esc(s.name || "-")}</td>
      <td>${tg ? `<span title="${tg.t} · ${n}회 제출" style="color:${tg.c};font-weight:700">${tg.m} ${tg.t}</span>` : '<span class="k">-</span>'}</td>
      <td>${esc(s.phone)}</td><td>${esc(s.academy || "-")}</td>
      <td>${esc(s.grade || "-")}</td><td>${esc(s.subject || "-")}</td>
      <td>${esc((s.created_at || "").slice(0, 10))}</td>
      <td>${n || '<span class="bad">0</span>'}</td>
      <td>${np ? `📷 ${np}` : '<span class="k">-</span>'}</td></tr>`;
  }
  h += `</table><p class='k'>학생 줄을 누르면 상담 리포트가 열립니다. 사진은 리포트 안 '제출 사진'에서 봅니다.</p>
  <div class="note" style="margin-top:10px">
    <b>성실도 등급</b> — 누적 제출 횟수 기준: 🌱 새싹(1~2) · ⭐ 성실(3~4) · 🔥 열공(5~9) · 👑 마스터(10+).
    반복·누적이 델타스킬의 핵심이라 이 지표로 <b>보상 대상(3회 이상)</b>을 가려냅니다.
    보상 예시(형이 정하기): 3회→개인 델타맵 우선 분석 · 5회→1:1 상담 10분 · 10회→맞춤 문제세트/기프티콘.
  </div>`;
  document.getElementById("main").innerHTML = h;
  show("main");
}
function filterRows() {
  const q = document.getElementById("q").value.trim();
  const onlyR = document.getElementById("onlyReward")?.checked;
  for (const tr of document.querySelectorAll("#tbl tr.click")) {
    const okQ = !q || (tr.dataset.t || "").includes(q);
    const okR = !onlyR || (+tr.dataset.n || 0) >= 3;
    tr.hidden = !(okQ && okR);
  }
}

// ── 상세(상담 리포트) 화면 ─────────────────────────
async function loadDetail(phone) {
  await deltamapReady;
  const j = await api({ action: "student", phone });
  const st = mergeByPhone(j.students)[0];
  const subs = j.submissions, resps = j.responses, cohort = j.cohort || {};
  const names = j.names || {}, photos = j.photos || {};
  const examName = c => names[c] || c || "-";   // 이름 있으면 이름, 없으면 코드
  const bySub = {}; for (const r of resps) (bySub[r.submission_id] = bySub[r.submission_id] || []).push(r);
  const codeOf = {}; for (const s of subs) codeOf[s.id] = s.exam_code;
  const wrong = resps.filter(r => r.result === "x");
  const lucky = resps.filter(r => r.result === "o" && r.confidence === "찍음");
  const shaky = resps.filter(r => r.result === "o" && r.confidence === "애매함");

  document.getElementById("title").textContent = `상담 리포트 — ${st.name || "(이름없음)"}`;
  let h = `<h2>기본 정보</h2><table><tr><th>이름</th><th>연락처</th><th>소속</th><th>구분</th><th>선택과목</th><th>가입일</th><th>제출</th></tr>
    <tr><td>${esc(st.name)}</td><td>${esc(st.phone)}</td><td>${esc(st.academy)}</td><td>${esc(st.grade)}</td>
    <td>${esc(st.subject)}</td><td>${esc((st.created_at || "").slice(0, 10))}</td><td>${subs.length}</td></tr></table>`;

  h += "<h2>응시 이력</h2>";
  if (subs.length) {
    h += "<table><tr><th>응시일</th><th>시험</th><th>회차</th><th>자기채점</th><th>문항</th><th>오답</th><th>찍어서 맞음</th></tr>";
    for (const s of [...subs].reverse()) {
      const rs = bySub[s.id] || [];
      const w = rs.filter(r => r.result === "x").length;
      const lk = rs.filter(r => r.result === "o" && r.confidence === "찍음").length;
      h += `<tr><td>${esc((s.created_at || "").slice(0, 10))}</td><td>${esc(examName(s.exam_code))}</td>
        <td>${esc(s.attempt_no)}</td><td>${esc(s.score)}</td><td>${rs.length}</td>
        <td class="bad">${w}</td><td>${lk}</td></tr>`;
    }
    h += "</table>";
  } else h += "<p class='note'>제출이 없습니다. 첫 제출 독려가 상담 주제입니다.</p>";

  const mine = {};
  for (const r of resps) if (r.area) {
    mine[r.area] = mine[r.area] || [0, 0]; mine[r.area][1]++;
    if (r.result === "o") mine[r.area][0]++;
  }
  if (resps.length) {
    h += "<h2>영역별 정답률 — 반 평균 대비</h2><table><tr><th>영역</th><th>문항</th><th>본인</th><th></th><th>반 평균</th></tr>";
    for (const a of Object.keys(mine).sort((x, y) => mine[x][0] / mine[x][1] - mine[y][0] / mine[y][1])) {
      const [o, t] = mine[a], [co, ct] = cohort[a] || [0, 0];
      const my = 100 * o / t, cl = ct ? 100 * co / ct : 0;
      h += `<tr><td>${esc(a)}</td><td>${t}</td><td${ct && my < cl - 10 ? ' class="bad"' : ""}>${pct(o, t)}</td>
        <td><span class="bar" style="width:${my.toFixed(0)}px"></span><br>
        <span class="gray" style="width:${cl.toFixed(0)}px"></span></td><td>${pct(co, ct)}</td></tr>`;
    }
    h += "</table><p class='k'>빨간 막대 = 본인, 회색 = 반 전체.</p>";

    const cnt = (arr, key) => {
      const c = {}; for (const r of arr) { const v = r[key]; if (v) c[v] = (c[v] || 0) + 1; }
      return Object.entries(c).sort((a, b) => b[1] - a[1]);
    };
    const cell = pairs => pairs.length ? pairs.map(([k, v]) => `${esc(k)} <b>${v}</b>`).join("<br>") : "<span class='k'>기록 없음</span>";
    h += `<h2>어디서 왜 막히는가</h2><table><tr><th>틀린 이유 (오답)</th><th>정답의 확신도</th><th>도달 단계 (오답)</th></tr>
      <tr><td>${cell(cnt(wrong, "reason"))}</td>
      <td>${cell(cnt(resps.filter(r => r.result === "o"), "confidence"))}</td>
      <td>${cell(cnt(wrong, "reached_step"))}</td></tr></table>`;
    if (lucky.length)
      h += `<p class="note warn">⚠ <b>찍어서 맞은 문항 ${lucky.length}개</b> — 점수에는 있지만 사실상 오답입니다.
        오답 ${wrong.length}개에 더한 ${wrong.length + lucky.length}개가 실제 학습 대상입니다.` +
        (shaky.length ? ` 애매하게 맞은 ${shaky.length}개도 재점검 후보.` : "") + "</p>";

    h += `<h2>오답 문항 (메모는 학생이 쓴 그대로)</h2>
      <table><tr><th>시험</th><th>번호</th><th>영역</th><th>단원</th><th>요구 스킬</th><th>내 답→정답</th><th>이유</th><th>도달</th><th>메모</th></tr>`;
    const list = [...wrong, ...lucky].sort((a, b) =>
      (codeOf[a.submission_id] || "").localeCompare(codeOf[b.submission_id] || "") || (a.item_no - b.item_no));
    for (const r of list) {
      const luck = r.result === "o";
      h += `<tr${luck ? ' class="warn"' : ""}><td>${esc(examName(codeOf[r.submission_id]))}</td>
        <td>${esc(r.item_no)}${luck ? "(찍맞)" : ""}</td><td>${esc(r.area)}</td><td>${esc(r.unit)}</td>
        <td>${skillCell(codeOf[r.submission_id], r.area, r.item_no)}</td>
        <td>${esc(r.my_answer)}→${esc(r.correct_answer)}</td><td>${esc(r.reason)}</td>
        <td>${esc(r.reached_step)}</td><td>${esc(r.memo)}</td></tr>`;
    }
    h += "</table>";
  }

  // 제출 사진 (학생이 파일럿 앱에서 올린 풀이·문제 사진)
  const photoSubs = Object.keys(photos);
  if (photoSubs.length) {
    h += "<h2>제출 사진</h2><p class='k'>학생이 올린 풀이·문제 사진입니다. 누르면 원본 크기로 열립니다. (링크는 1시간 뒤 만료 — 새로고침하면 다시 생성)</p>";
    for (const s of [...subs].reverse()) {
      const ph = photos[s.id]; if (!ph || !ph.length) continue;
      h += `<div style="margin:8px 0"><b>${esc(examName(s.exam_code))}</b> <span class="k">(${ph.length}장)</span><br>`;
      for (const p of ph) {
        h += `<a href="${esc(p.url)}" target="_blank" rel="noopener" title="${esc(p.no)}번 문항" style="display:inline-block;margin:4px 6px 0 0;text-align:center;font-size:11px;color:#555">
          <img src="${esc(p.url)}" alt="${esc(p.no)}번" style="width:120px;height:120px;object-fit:cover;border:1px solid #ddd;border-radius:6px;display:block">${esc(p.no)}번</a>`;
      }
      h += "</div>";
    }
  }

  if ((j.reviews || []).length) {
    const box = {}; let due = 0;
    const today = new Date().toISOString().slice(0, 10);
    for (const r of j.reviews) { box[r.box] = (box[r.box] || 0) + 1; if ((r.due_at || "9999") <= today) due++; }
    h += "<h2>복습 현황 (Leitner)</h2><p>" +
      Object.keys(box).sort().map(k => `<span class="tag">박스${k}: ${box[k]}</span>`).join(" ") +
      (due ? ` <span class="tag bad">기한 지남 ${due}</span>` : "") + "</p>";
  }

  const tips = [];
  if (!subs.length) tips.push("가입 후 미제출 — 첫 제출의 장벽이 무엇인지부터.");
  if (lucky.length) tips.push(`찍어서 맞은 ${lucky.length}문항을 본인은 '맞은 문제'로 기억하고 있을 것 — 그 착시부터 깨기.`);
  const rc = {}; for (const r of wrong) if (r.reason) rc[r.reason] = (rc[r.reason] || 0) + 1;
  const topR = Object.entries(rc).sort((a, b) => b[1] - a[1])[0];
  if (topR) tips.push(`틀린 이유 최빈 = '${topR[0]}' (${topR[1]}회) — 이 계열을 상담의 중심에.`);
  const areas = Object.keys(mine);
  if (areas.length) {
    const worst = areas.sort((x, y) => mine[x][0] / mine[x][1] - mine[y][0] / mine[y][1])[0];
    tips.push(`가장 약한 영역 = ${worst} (${pct(...mine[worst])}).`);
  }
  if (subs.length >= 2) {
    const d = (subs[subs.length - 1].score || 0) - (subs[0].score || 0);
    tips.push(`점수 흐름: 첫 ${subs[0].score}점 → 최근 ${subs[subs.length - 1].score}점 (${d >= 0 ? "+" : ""}${d}).`);
  }
  h += "<h2>상담 포인트 (자동 요약)</h2><div class='note'>" + tips.map(t => "· " + esc(t)).join("<br>") + "</div>";

  document.getElementById("detail").innerHTML = h;
  show("detail");
}

// ── 반별 현황 (코호트) ─────────────────────────────
// 운영자가 강사로서 보유한 성적 명단(official_scores)이 원천이다. 파일럿 학생 데이터와는 별개 명단이라
// 여기서는 반 단위 흐름만 본다 — 개인 오답 진단은 학생 목록 쪽 상담 리포트에서 본다.
// 파일럿 범위는 세 반. 넓히려면 이 상수만 고치면 된다.
const PILOT_CLASSES = ["I1", "I2", "I5"];
const SERIES = ["#c00", "#06c", "#690", "#8a6d00", "#c67"];   // 이 페이지가 이미 쓰는 색에서 고름
let COH = null, ITEMS = null, COH_SEL = null, COH_SUBJ = null;

async function openCohort(exam) {
  try {
    COH = await api({ action: "cohort", ...(exam ? { exam_code: exam } : {}) });
    if (!COH_SEL) {
      const has = new Set(COH.classes);
      const pick = PILOT_CLASSES.filter(c => has.has(c));
      COH_SEL = new Set(pick.length ? pick : COH.classes.slice(0, 3));
    }
    ITEMS = null; COH_SUBJ = null;
    try { ITEMS = await api({ action: "items", exam_code: COH.exam_code }); } catch (_) {}
    if (ITEMS && ITEMS.subjects.length) COH_SUBJ = ITEMS.subjects[0];
    renderCohort();
  } catch (e) {
    if (e.message === "auth") return;
    alert(e.message === "forbidden" ? "반별 현황은 운영자 계정만 볼 수 있습니다." : "불러오지 못했습니다: " + e.message);
  }
}
function pickExam(sel) { openCohort(sel.value); }   // 반 선택(COH_SEL)은 회차를 바꿔도 유지된다
function toggleClass(i) { const c = COH.classes[i]; COH_SEL.has(c) ? COH_SEL.delete(c) : COH_SEL.add(c); renderCohort(); }
function pickSubj(i) { COH_SUBJ = ITEMS.subjects[i]; renderCohort(); }

/* 반별 회차 추이 — 인라인 SVG 꺾은선 */
function trendChart(trend, sel, exams) {
  const rows = trend.filter(t => sel.has(t.class) && t.avg_math != null);
  if (rows.length < 2 || exams.length < 2) return "";
  const W = 620, H = 200, L = 36, R = 10, T = 12, B = 28;
  const vals = rows.map(t => t.avg_math);
  const lo = Math.max(0, Math.floor(Math.min(...vals) / 10) * 10 - 5);
  const hi = Math.min(100, Math.ceil(Math.max(...vals) / 10) * 10 + 5);
  const X = i => L + i * (W - L - R) / (exams.length - 1);
  const Y = v => T + (hi - v) * (H - T - B) / (hi - lo || 1);
  let g = "";
  for (let v = lo; v <= hi; v += 10) {
    g += `<line x1="${L}" y1="${Y(v)}" x2="${W - R}" y2="${Y(v)}" stroke="#eee"/>
      <text x="${L - 6}" y="${Y(v) + 4}" font-size="10" fill="#999" text-anchor="end">${v}</text>`;
  }
  exams.forEach((e, i) => {
    g += `<text x="${X(i)}" y="${H - 8}" font-size="10" fill="#777" text-anchor="middle">${esc(e.replace(/^OMEGA_/, ""))}회</text>`;
  });
  const cls = [...sel].filter(c => rows.some(r => r.class === c));
  cls.forEach((c, ci) => {
    const col = SERIES[ci % SERIES.length];
    const pts = exams.map((e, i) => {
      const r = rows.find(t => t.class === c && t.exam_code === e);
      return r ? { x: X(i), y: Y(r.avg_math), v: r.avg_math } : null;
    }).filter(Boolean);
    if (pts.length < 2) return;
    g += `<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.map(p => p.x + "," + p.y).join(" ")}"/>`;
    g += pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${col}"><title>${esc(c)} ${p.v}점</title></circle>`).join("");
  });
  const legend = cls.map((c, ci) =>
    `<span class="tag" style="border-left:10px solid ${SERIES[ci % SERIES.length]}">${esc(c)}</span>`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;background:#fff;border:1px solid #e5e5e5;border-radius:8px">${g}</svg>
    <div style="margin:4px 0">${legend}</div>`;
}

function renderCohort() {
  // 평균 내림차순으로 다시 정렬한다 — 서버가 정렬해 주더라도 여기서 보장한다.
  const sel = COH_SEL;
  const all = COH.by_class.filter(c => sel.has(c.class))
    .sort((a, b) => (b.avg_math ?? -1) - (a.avg_math ?? -1));
  const examLabel = c => esc(c.replace(/^OMEGA_/, "OMEGA ") + (/^OMEGA_/.test(c) ? "회" : ""));
  document.getElementById("title").textContent = `반별 현황 — ${examLabel(COH.exam_code)}`;

  // 선택 반 기준 KPI
  const n = all.reduce((a, c) => a + c.n, 0);
  const avg = n ? all.reduce((a, c) => a + c.avg_math * c.n, 0) / n : null;
  const drop = COH.alerts.dropped.filter(d => sel.has(d.class));
  const abs = COH.alerts.absent.filter(d => sel.has(d.class));
  // 격차는 순서에 기대지 않고 최대·최소로 직접 구한다.
  const avgs = all.map(c => c.avg_math).filter(v => v != null);
  const gap = avgs.length > 1 ? Math.max(...avgs) - Math.min(...avgs) : null;

  let h = `<div class="row noprint" style="margin:6px 0 2px">
    <label class="k">회차
      <select onchange="pickExam(this)">${COH.exams.map(e =>
        `<option value="${esc(e)}"${e === COH.exam_code ? " selected" : ""}>${examLabel(e)}</option>`).join("")}</select>
    </label>
    <span class="k">직전 회차 대비: ${COH.prev_exam_code ? examLabel(COH.prev_exam_code) : "없음"}</span>
  </div>
  <div class="row noprint" style="margin-bottom:8px">${COH.classes.map((c, i) =>
    `<label class="chk"><input type="checkbox" ${sel.has(c) ? "checked" : ""} onchange="toggleClass(${i})">${esc(c)}</label>`).join("")}</div>`;

  h += `<div class="cards">
    <div class="card"><b>${all.length}</b>반</div>
    <div class="card"><b>${n}</b>응시 인원</div>
    <div class="card"><b>${avg == null ? "-" : avg.toFixed(1)}</b>수학 평균</div>
    <div class="card"><b>${gap == null ? "-" : gap.toFixed(1)}</b>최고–최저 반 격차</div>
    <div class="card"><b class="${drop.length ? "bad" : ""}">${drop.length}</b>급락(−10점↓)</div>
    <div class="card"><b class="${abs.length ? "bad" : ""}">${abs.length}</b>미응시</div>
  </div>`;

  if (!all.length) {
    h += "<p class='note'>표시할 반을 선택하세요.</p>";
    document.getElementById("cohort").innerHTML = h; show("cohort"); return;
  }

  // 반별 비교
  h += `<h2>반별 비교</h2><table><tr><th>반</th><th>인원</th><th>평균</th><th></th><th>표준편차</th><th>평균 등급</th><th>선택과목</th></tr>`;
  for (const c of all) {
    const wide = c.sd != null && c.sd >= 15;
    h += `<tr><td>${esc(c.class)}</td><td class="num">${c.n}</td>
      <td class="num">${c.avg_math ?? "-"}</td>
      <td><span class="bar" style="width:${(c.avg_math || 0).toFixed(0)}px"></span></td>
      <td class="num${wide ? ' bad' : ''}" ${wide ? 'title="편차가 커서 반 안에서 수준 차가 큽니다"' : ""}>${c.sd ?? "-"}</td>
      <td class="num">${c.avg_grade ?? "-"}</td>
      <td>${Object.entries(c.types).map(([k, v]) => `<span class="tag">${esc(k)} ${v}</span>`).join(" ")}</td></tr>`;
  }
  h += `</table><p class="k">평균 막대는 100점 기준입니다. 표준편차 15 이상은 반 안 수준 차가 크다는 신호로 표시합니다.</p>`;

  // 회차 추이
  const chart = trendChart(COH.trend, sel, COH.exams);
  if (chart) h += `<h2>회차 추이</h2>${chart}`;

  // 이번 주 할 일
  h += `<h2>이번 주 할 일</h2>`;
  if (!drop.length && !abs.length) {
    h += `<p class="note">직전 회차 대비 급락·미응시가 없습니다.</p>`;
  } else {
    if (drop.length) {
      h += `<p class="note warn">⚠ <b>급락 ${drop.length}명</b> — 직전 회차보다 10점 이상 떨어진 학생입니다. 원인(컨디션·범위·유형)을 먼저 확인하십시오.</p>
        <table><tr><th>반</th><th>이름</th><th>학번</th><th>직전</th><th>이번</th><th>변화</th></tr>`;
      for (const d of drop) h += `<tr><td>${esc(d.class)}</td><td>${esc(d.name)}</td><td class="k">${esc(d.student_no || "-")}</td>
        <td class="num">${d.prev_math}</td><td class="num">${d.math}</td><td class="num bad">${d.delta}</td></tr>`;
      h += `</table>`;
    }
    if (abs.length) {
      h += `<h2 style="font-size:14px">미응시 ${abs.length}명</h2><table><tr><th>반</th><th>이름</th><th>학번</th><th>직전 점수</th></tr>`;
      for (const d of abs) h += `<tr><td>${esc(d.class)}</td><td>${esc(d.name)}</td><td class="k">${esc(d.student_no || "-")}</td>
        <td class="num">${d.prev_math ?? "-"}</td></tr>`;
      h += `</table>`;
    }
  }

  // 결정 문항
  if (ITEMS && ITEMS.items.length) {
    const list = ITEMS.items.filter(i => i.subject === COH_SUBJ).sort((a, b) => a.correct_rate - b.correct_rate);
    h += `<h2>결정 문항 — 정답률이 낮은 순</h2>
      <div class="row noprint" style="margin-bottom:6px">${ITEMS.subjects.map((s, i) =>
        `<button class="${s === COH_SUBJ ? "sel" : ""}" onclick="pickSubj(${i})">${esc(s)}</button>`).join("")}</div>
      <table><tr><th>번호</th><th>정답</th><th>정답률</th><th></th><th>유형</th><th>최다 오답</th></tr>`;
    for (const it of list.slice(0, 10)) {
      const tw = it.top_wrong;
      h += `<tr><td>${it.item_no}</td><td>${esc(it.answer)}</td>
        <td class="num${it.correct_rate < 40 ? " bad" : ""}">${it.correct_rate}%</td>
        <td><span class="bar" style="width:${Math.round(it.correct_rate)}px"></span></td>
        <td>${it.objective ? "객관식" : "단답형"}</td>
        <td>${tw ? `${tw.choice}번 <b>${tw.rate}%</b>` : '<span class="k">-</span>'}</td></tr>`;
    }
    h += `</table><p class="k">단답형은 선택지 분포가 없어 최다 오답을 만들지 않습니다 (있는 것처럼 보이면 거짓이 됩니다).
      기하는 분석 대상에서 제외합니다.</p>`;
  }

  document.getElementById("cohort").innerHTML = h;
  show("cohort");
}

// ── 데모 자료 (?demo=1 — 판형 확인용, 서버 호출 없음) ──

    { id: "a", phone: "010-0000-0001", name: "예시학생", academy: "신촌메가스터디", grade: "고3", subject: "미적분", created_at: "2026-07-01" },

  const names = { OMEGA_8: "OMEGA 8회", OMEGA_9: "OMEGA 9회" };
  if (body.action === "students") return { ok: 1, role: "owner", academy: null, students, submissions, names,

    const base = { "A반": 80, "B반": 72, "C반": 49 };
    const by_class = Object.entries(base).map(([c, v], i) => ({
      class: c, n: [22, 30, 15][i], avg_math: v, sd: [8.5, 10.1, 21.6][i], avg_grade: [3.6, 4.8, 7.1][i],
      types: [{ "확통": 7, "미적분": 15 }, { "확통": 21, "미적분": 9 }, { "확통": 12, "미적분": 3 }][i] }));
    const trend = [];
    exams.forEach((e, ei) => Object.entries(base).forEach(([c, v]) =>
      trend.push({ exam_code: e, class: c, n: 20, avg_math: +(v - 5 + ei * 1.7).toFixed(1) })));
    return { ok: 1, exam_code: exam, prev_exam_code: exams[exams.indexOf(exam) - 1] || "",
      exams, classes: Object.keys(base), by_class, trend,
      alerts: { dropped: [{ name: "예시학생", student_no: "600001", class: "C반", prev_math: 62, math: 48, delta: -14 }],
                absent: [{ name: "김파일럿", student_no: "600002", class: "B반", prev_math: 70 }] } };
  }
  if (body.action === "items") {
    const items = [];
    for (const s of ["미적분", "확통"]) for (let no = 1; no <= 30; no++) {
      const rate = no >= 28 ? 5 + no : no >= 20 ? 30 + no : 70 + (no % 20);
      const obj = no <= 15;
      items.push({ item_no: no, subject: s, answer: obj ? String(no % 5 + 1) : String(100 + no),
        correct_rate: rate, objective: obj, choices: obj ? [10, 20, 30, 20, 20] : [0, 0, 0, 0, 0],
        top_wrong: obj ? { choice: (no % 5) + 1, rate: 100 - rate } : null });
    }
    return { ok: 1, exam_code: body.exam_code || "OMEGA_8", subjects: ["미적분", "확통"], items };

  if (body.action === "student") {
    const st = students.filter(s => s.phone === body.phone);
    const subs = submissions.filter(s => s.student_id === st[0].id);
    const responses = [];
    for (const s of subs) for (let no = 1; no <= 30; no++) {

          reached_step: (no % 4 + 1) + "단계", confidence: null, memo: no === 13 ? "식은 세웠는데 그 다음이 막막했음" : null });
      } else if ([10, 15].includes(no)) Object.assign(r, { confidence: "찍음" });
      else if (no % 7 === 0) Object.assign(r, { confidence: "애매함" });
      responses.push(r);
    }
    const ph = "data:image/svg+xml;utf8," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' fill='#eee'/><text x='60' y='64' font-size='13' text-anchor='middle' fill='#999'>예시 사진</text></svg>");
    const photos = subs.length ? { [subs[0].id]: [{ no: 13, url: ph }, { no: 21, url: ph }] } : {};
    return { ok: 1, students: st, submissions: subs, responses, names, photos,
      reviews: [{ box: 1, due_at: "2026-08-06" }, { box: 2, due_at: "2026-08-20" }],
      cohort: { "수학Ⅰ": [300, 420], "수학Ⅱ": [500, 830] } };
  }
  return { ok: 1 };
}
</script>
