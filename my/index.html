<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>델타스킬 · 내 오답노트</title>
<style>
:root{--acc:#5aa2ff;--acc2:#a8cbff;--mut:#9fb2cc;--line:rgba(186,215,247,.14);--line2:rgba(186,215,247,.24);--bg:#05060f;--card:#0c1222;--red:#5aa2ff}
*{box-sizing:border-box}
body{font-family:Pretendard,'Malgun Gothic',-apple-system,sans-serif;margin:0;color:#e8eef7;line-height:1.55;background:var(--bg)}
a{color:var(--acc2)}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:16px;text-decoration:none;color:#fff}
.brand img{width:22px;height:22px}
h1{font-size:19px;border-bottom:2px solid var(--acc);padding-bottom:8px;margin:10px 0 12px;color:#fff}
h2{font-size:15px;margin:20px 0 8px;border-left:4px solid var(--acc);padding-left:8px;color:#fff}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:rgba(186,214,247,.08)}
.k{color:var(--mut);font-size:12px}.bad{color:#ff8a8a;font-weight:600}.warn{background:rgba(255,213,79,.12)}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;flex:1;min-width:88px;text-align:center}
.card b{font-size:22px;display:block;color:#fff}
button{font:inherit;padding:9px 14px;border:1px solid var(--line2);border-radius:8px;background:rgba(186,214,247,.09);color:#e8eef7;cursor:pointer}
button.p{background:var(--acc);border-color:transparent;color:#04101f;width:100%;font-weight:700}
button.sm{padding:6px 12px;font-size:13px}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line2);border-radius:8px;width:100%;margin:4px 0;background:#0a1020;color:#e8eef7}
.card2{max-width:430px;margin:5vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 22px}@media(max-width:480px){.card2{margin:10px;max-width:none;padding:20px 16px}}
.err{color:#ff8a8a;font-size:13px;min-height:18px;margin:4px 0}
.lnk{color:var(--acc2);font-size:13px;background:none;border:none;padding:6px 0;cursor:pointer;text-decoration:underline}
.anchor{color:#ffd166;font-weight:600}
.field{margin:8px 0}.field label{font-size:13px;font-weight:600;display:block;margin-bottom:2px}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--acc);color:#04101f;border-color:var(--acc)}.acg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.acg button.full{grid-column:1/-1}.acg button.on{background:var(--acc);color:#04101f;border-color:var(--acc)}
.ph{max-width:120px;border:1px solid var(--line);border-radius:6px;margin:3px}
.sub{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;margin:6px 0;cursor:pointer}
.sub:hover{background:rgba(186,214,247,.08)}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;margin:9px 0;line-height:1.55;color:var(--mut)}.consent input[type=checkbox]{width:16px;height:16px;flex:0 0 16px;margin:2px 0 0;padding:0;accent-color:var(--acc)}.consent b{color:#e8eef7}
.ol{list-style:none;padding:0;margin:8px 0;counter-reset:s}
.ol li{position:relative;padding:11px 12px 11px 42px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:6px 0;font-size:13.5px}
.ol li:before{counter-increment:s;content:counter(s);position:absolute;left:10px;top:11px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#04101f;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.rep-tag{display:inline-block;font-size:11px;font-weight:700;color:#ffd166;border:1px solid rgba(255,209,102,.4);border-radius:999px;padding:1px 7px;margin-left:6px}
.dir{border-left:3px solid var(--acc);background:rgba(90,162,255,.07);border-radius:0 8px 8px 0;padding:9px 12px;margin:6px 0;font-size:13px}
#report:not(:empty){border:1px solid var(--line2);border-radius:14px;padding:6px 14px 16px;margin:8px 0 14px;background:rgba(10,16,32,.5)}
@media print{.top,#reportBtn,#body>h2,#body>.cards,.sub,.det{display:none!important}#report:not(:empty){border:none;background:#fff}body{background:#fff;color:#111}h1,h2,.card b{color:#111}}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login" class="card2" hidden>
  <a href="/" class="brand"><img src="/logo-dark-192.png" alt=""><span>델타스킬</span></a>
  <h1 style="border:none;font-size:18px;margin:12px 0 4px">내 오답노트</h1>
  <p class="k" id="lmode">가입한 전화번호와 비밀번호로 로그인하세요.</p>
  <input id="phone" placeholder="전화번호 (- 없이)" inputmode="numeric" autocomplete="username">
  <input id="pw" placeholder="숫자 4자리 비밀번호" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="p" id="loginBtn" onclick="doLogin()">로그인</button>
  <div style="text-align:center;margin-top:10px"><button class="lnk" onclick="location.href='/my/?signup'">처음이신가요? 회원가입</button></div>
</div>

<!-- 회원가입 -->
<div id="signup" class="card2" hidden>
  <a href="/" class="brand"><img src="/logo-dark-192.png" alt=""><span>델타스킬</span></a>
  <h1 style="border:none;font-size:18px;margin:12px 0 4px">회원가입</h1>
  <div class="field"><label>전화번호 (- 없이)</label><input id="s_phone" inputmode="numeric" placeholder="01000000000"></div>
  <div class="field"><label>이름</label><input id="s_name" placeholder="이름"></div>
  <div class="field"><label>학원 선택</label><div class="acg" id="s_acg"><button type="button" data-ac="메가스터디">메가스터디</button><button type="button" data-ac="시대인재">시대인재</button><button type="button" data-ac="대성학원">대성학원</button><button type="button" data-ac="청솔학원">청솔학원</button><button type="button" data-ac="종로학원">종로학원</button><button type="button" data-ac="__etc" class="full">기타 (직접 입력)</button><button type="button" data-ac="비재원생" class="full">비재원생</button></div><input id="s_academy" placeholder="학원명을 직접 입력하세요" style="display:none;margin-top:8px"></div>
  <div class="field"><label>구분</label><div class="seg" id="s_grade"><button data-g="재수생">재수생(N수)</button><button data-g="고3">고3</button></div></div>
  <div class="field"><label>수학 선택과목</label><div class="seg" id="s_subject"><button data-s="미적분">미적분</button><button data-s="확통">확률과통계</button></div></div>
  <div class="field"><label>비밀번호 (숫자 4자리)</label><input id="s_pw" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="숫자 4자리"></div>
  <div class="field"><label>비밀번호 확인</label><input id="s_pw2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="숫자 4자리 다시 입력"></div>
  <label class="consent"><input type="checkbox" id="s_consent"><span><b>[필수]</b> 만 14세 이상이며 <a href="/privacy/" target="_blank">개인정보 수집·이용 및 AI 자동 분석</a>에 동의합니다.</span></label>
  <label class="consent"><input type="checkbox" id="s_notify"><span>[선택] 복습 알림(카카오톡·문자) 수신에 동의합니다.</span></label>
  <div class="err" id="serr"></div>
  <button class="p" id="signupBtn" onclick="doSignup()">가입하고 시작</button>
  <div style="text-align:center;margin-top:10px"><button class="lnk" onclick="location.href='/my/'">← 로그인으로</button></div>
</div>

<!-- 결과 -->
<div id="app" class="wrap" hidden>
  <div class="top">
    <a href="/" class="brand"><img src="/logo-dark-192.png" alt=""><span>델타스킬</span></a>
    <div><button class="sm" onclick="location.href='/pilot/'">오답노트 쓰기</button> <button class="sm" onclick="doLogout()">로그아웃</button></div>
  </div>
  <h1 id="hello">내 오답노트</h1>
  <div id="body"></div>
</div>

<script>
const API = "https://cvlrphtupjmaefahodgz.supabase.co/functions/v1/api";
const TK = { get:()=>localStorage.getItem("ds_tk")||"", set:t=>localStorage.setItem("ds_tk",t), clear:()=>localStorage.removeItem("ds_tk") };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (n,d)=> d ? Math.round(100*n/d)+"%" : "-";

/* 문항별 요구 스킬 (계류) — /skills.json 하나에서 불러온다. 회차 추가 시 그 파일만 교체. */
let ITEM_SKILLS = {};
const skillsReady = fetch("/skills.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{ITEM_SKILLS=d;}).catch(()=>{});

const AREA2TRACK = {"수학Ⅰ":"공통","수학Ⅱ":"공통","공통":"공통","미적분(선택)":"미적분","미적분":"미적분","확률과통계":"확통","확률과 통계":"확통","확통":"확통","기하":"기하"};
function skillsOf(exam,area,no){const E=ITEM_SKILLS[exam];if(!E)return null;const n=+no;if(n>=1&&n<=22&&E["공통"]&&E["공통"][no])return E["공통"][no];const tr=AREA2TRACK[area]||area;return (E[tr]&&E[tr][no])||null;}
function useName(u){return typeof u==="string"?u:((u&&u.skill)||"");}
function skillCell(exam,area,no){const s=skillsOf(exam,area,no);if(!s)return "<span class='k'>-</span>";const as=(s.anchors||[]).map(useName).filter(Boolean);const us=(s.uses||[]).map(useName).filter(Boolean);if(!as.length&&!us.length)return "<span class='k'>-</span>";let o="";if(as.length)o+=as.map(a=>`<span class="anchor">⚡ ${esc(a)}</span>`).join("<br>");if(us.length){if(o)o+="<br>";o+="<span class='k'>"+us.map(esc).join(" · ")+"</span>";}return o;}

/* 시험명 · 교육과정(상류→하류) 순서 · 오답원인별 처방 — 리포트/이력 공용 */
const EXAM_NAMES={OMEGA_8:"OMEGA 8회",OMEGA_9:"OMEGA 9회",OMEGA_5:"OMEGA 5회",OMEGA_6:"OMEGA 6회",OMEGA_7:"OMEGA 7회",OMEGA_10:"OMEGA 10회",SV27_04:"서바이벌 4회",SV27_01:"서바이벌 1회",SV27_02:"서바이벌 2회",SV27_03:"서바이벌 3회",HP26_03:"3월 학평",HP26_05:"5월 학평",HP26_07:"7월 학평",MP27_06:"6월 모평",EX2028_V1:"델타스킬 모의 1회",SN26:"2026 수능",JD27_07:"7월 전대실모",JQ27_02:"지QUEL 2회",JQ27_03:"지QUEL 3주"};
function examName(c){return EXAM_NAMES[c]|| (typeof c==="string"&&c.indexOf("자유:")===0?c.slice(3):c) || "-";}
const ORDER=["지수함수와 로그함수","삼각함수","함수의 극한과 연속","다항함수의 미분법","다항함수의 적분법","수열","미분법","적분법","수열의 극한","경우의 수","확률","통계"];
const REASONFIX={"개념 모름":"개념 강의·개념서로 이해 → 기초 유형 5문항","계산 실수":"같은 유형 계산 드릴 10문항(속도·정확도)","접근 안 떠오름":"유형별 대표문항 풀이법 정리 → 유사 3문항","시간 부족":"타임어택 세트(문항당 목표시간)","아는데 실수":"오답 검토 루틴 체크리스트","안 배움":"해당 단원 진도 보강 강의"};

async function api(path,opt){opt=opt||{};const method=opt.method||"GET";const auth=opt.auth!==false;const h={"Content-Type":"application/json"};if(auth){const t=TK.get();if(!t)throw new Error("no_token");h["Authorization"]="Bearer "+t;}const r=await fetch(API+path,{method,headers:h,body:opt.body?JSON.stringify(opt.body):undefined});let j=null;try{j=await r.json();}catch(_){}if(r.status===401&&auth){TK.clear();boot();}if(!r.ok||!j||j.ok===false)throw new Error((j&&j.error)||("HTTP "+r.status));return j;}

/* ---- 로그인 ---- */
async function doLogin(){
  document.getElementById("lerr").textContent="";
  const phone=document.getElementById("phone").value.replace(/[^0-9]/g,""), pw=document.getElementById("pw").value;
  if(phone.length<10){document.getElementById("lerr").textContent="전화번호를 정확히 입력하세요.";return;}
  try{ const j=await api("/login",{method:"POST",auth:false,body:{phone,pin:pw}}); TK.set(j.token); localStorage.setItem("ds_phone",phone); boot(); }
  catch(e){ document.getElementById("lerr").textContent = e.message==="invalid"?"전화번호 또는 비밀번호가 맞지 않아요.":e.message==="locked"?"시도가 많아 잠시 잠겼어요. 15분 후 다시.":"로그인에 실패했어요."; }
}

/* ---- 회원가입 ---- */
let SG={grade:"",subject:"",academy:""};
function bindAcg(){document.querySelectorAll("#s_acg button").forEach(b=>b.onclick=()=>{SG.academy=b.dataset.ac;document.querySelectorAll("#s_acg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById("s_academy").style.display=(SG.academy==="__etc")?"block":"none";});}
function bindSeg(id,key){document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{SG[key]=b.dataset.g||b.dataset.s;document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove("on"));b.classList.add("on");});}
async function doSignup(){
  document.getElementById("serr").textContent="";
  const phone=document.getElementById("s_phone").value.replace(/[^0-9]/g,"");
  const name=document.getElementById("s_name").value.trim();
  const academy=(SG.academy==="__etc")?document.getElementById("s_academy").value.trim():SG.academy;
  const pw=document.getElementById("s_pw").value, pw2=document.getElementById("s_pw2").value;
  const consent=document.getElementById("s_consent").checked, notify=document.getElementById("s_notify").checked;
  const err=m=>{document.getElementById("serr").textContent=m;};
  if(phone.length<10)return err("전화번호를 정확히 입력하세요.");
  if(!name)return err("이름을 입력하세요.");
  if(!academy)return err("학원을 선택하세요 (직접 입력 시 학원명 기재).");
  if(!SG.grade||!SG.subject)return err("구분과 선택과목을 골라주세요.");
  if(!/^\d{4}$/.test(pw))return err("비밀번호는 숫자 4자리예요.");
  if(pw!==pw2)return err("비밀번호가 일치하지 않아요.");
  if(!consent)return err("필수 동의가 필요해요.");
  try{
    const j=await api("/enroll",{method:"POST",auth:false,body:{phone,pin:pw,name,academy,grade:SG.grade,subject:SG.subject,consent:true,consent_notify:notify}});
    TK.set(j.token); localStorage.setItem("ds_phone",phone); history.replaceState({},"", "/my/"); boot();
  }catch(e){ err(e.message==="already_enrolled"?"이미 가입된 번호예요. 로그인해 주세요.":e.message==="weak_pin"?"너무 쉬운 비밀번호예요.":"가입에 실패했어요."); }
}

async function doLogout(){ TK.clear(); location.href="/"; }

function boot(){
  const has=!!TK.get(), wantSignup=location.search.indexOf("signup")>=0;
  document.getElementById("app").hidden=!has;
  document.getElementById("login").hidden=has||wantSignup;
  document.getElementById("signup").hidden=has||!wantSignup;
  if(has) load();
  else if(wantSignup){ bindSeg("s_grade","grade"); bindSeg("s_subject","subject");bindAcg(); }
}

/* ---- 결과 ---- */
async function load(){
  const body=document.getElementById("body"); body.innerHTML="<p class='k'>불러오는 중…</p>"; await skillsReady;
  let hist;
  try{ hist=await api("/history"); }catch(e){ if(e.message==="no_token"){boot();return;} body.innerHTML="<p class='bad'>불러오지 못했어요. 다시 시도해 주세요.</p>"; return; }
  const subs=hist.items||[];
  window.__examOf={}; subs.forEach(s=>window.__examOf[s.submission_id]=s.exam_code);
  if(!subs.length){ body.innerHTML="<p class='k'>아직 제출한 오답노트가 없어요. <a href='/pilot/'>오답노트 쓰러 가기 →</a></p>"; return; }
  let h=`<div class="cards"><div class="card"><b>${subs.length}</b><div class="k">제출 회차</div></div>
    <div class="card"><b>${esc(subs[0].score??"-")}</b><div class="k">최근 자기채점</div></div></div>`;
  h+=`<button class="p" id="reportBtn" style="margin:4px 0 2px">📊 분석 리포트 받기</button><div id="report"></div>`;
  h+="<h2>제출 이력 <span class='k'>(누르면 오답·요구 스킬)</span></h2>";
  for(const s of subs){
    h+=`<div class="sub" data-sub="${esc(s.submission_id)}"><b>${esc(examName(s.exam_code))}</b> <span class="k">· ${esc((s.created_at||"").slice(0,10))} · ${esc(s.attempt_no||1)}회차 · 자기채점 ${esc(s.score??"-")}</span>
      <div class="det k" id="det_${esc(s.submission_id)}" style="margin-top:6px"></div></div>`;
  }
  body.innerHTML=h;
  document.querySelectorAll("[data-sub]").forEach(el=>el.onclick=()=>openSub(el.dataset.sub, examName));
  const rb=document.getElementById("reportBtn"); if(rb)rb.onclick=generateReport;
}

const OPENED={};
async function openSub(id, examName){
  const box=document.getElementById("det_"+id); if(!box)return;
  if(OPENED[id]){ box.innerHTML=""; OPENED[id]=false; return; }
  box.innerHTML="불러오는 중…"; OPENED[id]=true;
  let j; try{ j=await api("/submission?id="+encodeURIComponent(id)); }catch(e){ box.innerHTML="<span class='bad'>불러오기 실패</span>"; return; }
  const rs=j.responses||[];
  // exam_code는 응답에 없을 수 있어 이력에서 가져온다
  const excode=(window.__examOf&&window.__examOf[id])||"";
  const wrong=rs.filter(r=>r.result==="x");
  const areas={}; rs.forEach(r=>{if(!r.area)return;areas[r.area]=areas[r.area]||[0,0];areas[r.area][1]++;if(r.result==="o")areas[r.area][0]++;});
  let h="";
  const ar=Object.keys(areas);
  if(ar.length){ h+="<div style='margin:6px 0'><b>영역별 정답률</b>: "+ar.map(a=>`${esc(a)} ${pct(areas[a][0],areas[a][1])}`).join(" · ")+"</div>"; }
  if(wrong.length){
    h+="<table><tr><th>번호</th><th>영역</th><th>요구 스킬</th><th>내답→정답</th><th>이유</th></tr>";
    for(const r of wrong){
      h+=`<tr><td>${esc(r.item_no)}</td><td>${esc(r.area)}</td><td>${skillCell(excode,r.area,r.item_no)}</td>
        <td>${esc(r.my_answer)}→${esc(r.correct_answer)}</td><td>${esc(r.reason)}</td></tr>`;
    }
    h+="</table>";
    // 사진
    const withPhoto=rs.filter(r=>r.photo_path);
    if(withPhoto.length){ h+="<div style='margin-top:6px'><b>내 풀이 사진</b><br>"; for(const r of withPhoto){ h+=`<button class="sm" data-photo="${id}|${r.item_no}">${r.item_no}번 사진 보기</button> `; } h+="<div class='photobox'></div></div>"; }
  } else { h+="<span class='k'>이 회차 오답이 없어요.</span>"; }
  box.innerHTML=h;
  box.querySelectorAll("[data-photo]").forEach(b=>b.onclick=async()=>{const [sub,no]=b.dataset.photo.split("|");try{const p=await api(`/photo?submission_id=${encodeURIComponent(sub)}&item_no=${no}`);box.querySelector(".photobox").innerHTML=`<a href="${esc(p.url)}" target="_blank" rel="noopener"><img class="ph" src="${esc(p.url)}"></a>`;}catch(_){b.textContent="사진 없음";}});
}

/* ---- 분석 리포트 ---- */
async function generateReport(){
  const rep=document.getElementById("report"); if(!rep)return;
  const btn=document.getElementById("reportBtn");
  if(rep.innerHTML.trim()){ rep.innerHTML=""; if(btn)btn.textContent="📊 분석 리포트 받기"; return; }
  if(btn){btn.disabled=true;btn.textContent="리포트 생성 중…";}
  rep.innerHTML="<p class='k'>제출한 회차를 모아 분석하고 있어요…</p>";
  await skillsReady;
  const done=(t)=>{if(btn){btn.disabled=false;btn.textContent=t;}};
  let hist; try{ hist=await api("/history"); }catch(e){ rep.innerHTML="<p class='bad'>리포트를 만들지 못했어요. 다시 시도해 주세요.</p>"; done("📊 분석 리포트 받기"); return; }
  const subs=hist.items||[];
  if(!subs.length){ rep.innerHTML="<p class='k'>분석할 제출 기록이 없어요. 먼저 <a href='/pilot/'>오답노트</a>를 작성해 주세요.</p>"; done("📊 분석 리포트 받기"); return; }
  const details=await Promise.all(subs.map(s=>api("/submission?id="+encodeURIComponent(s.submission_id)).then(j=>({s,rs:j.responses||[]})).catch(()=>({s,rs:[]}))));

  const byUnit={},byArea={},reasonCount={},skillCount={}; let totalWrong=0; const scored=[];
  for(const {s,rs} of details){
    scored.push({name:examName(s.exam_code),date:(s.created_at||"").slice(0,10),score:(s.score==null?null:s.score),attempt:s.attempt_no||1});
    for(const r of rs){
      if(r.area){const a=byArea[r.area]=byArea[r.area]||[0,0];a[1]++;if(r.result==="o")a[0]++;}
      if(r.result==="x"){
        totalWrong++;
        if(r.reason)reasonCount[r.reason]=(reasonCount[r.reason]||0)+1;
        const sk=skillsOf(s.exam_code,r.area,r.item_no); const nm=[];
        if(sk){(sk.anchors||[]).forEach(a=>{const x=useName(a);if(x)nm.push(x);});(sk.uses||[]).forEach(u=>{const x=useName(u);if(x)nm.push(x);});}
        nm.forEach(x=>{skillCount[x]=(skillCount[x]||0)+1;});
        if(r.unit){const u=byUnit[r.unit]=byUnit[r.unit]||{wrong:0,exams:{},area:r.area||"",skills:{}};u.wrong++;u.exams[s.exam_code]=1;nm.forEach(x=>{u.skills[x]=(u.skills[x]||0)+1;});}
      }
    }
  }
  const units=Object.keys(byUnit).map(u=>({unit:u,wrong:byUnit[u].wrong,exams:Object.keys(byUnit[u].exams).length,skills:byUnit[u].skills}));
  const oi=u=>{const i=ORDER.indexOf(u);return i<0?99:i;};
  const repeated=units.filter(u=>u.exams>=2);
  const byFreq=units.slice().sort((a,b)=>b.wrong-a.wrong);
  const study=units.slice().sort((a,b)=>((b.exams>=2)-(a.exams>=2))||(oi(a.unit)-oi(b.unit))||(b.wrong-a.wrong)).slice(0,6);
  const topSkills=Object.keys(skillCount).sort((a,b)=>skillCount[b]-skillCount[a]).slice(0,6);
  const topReasons=Object.keys(reasonCount).sort((a,b)=>reasonCount[b]-reasonCount[a]);
  const nums=scored.filter(x=>typeof x.score==="number");
  const avg=nums.length?Math.round(nums.reduce((s,x)=>s+x.score,0)/nums.length):null;
  const dates=scored.map(x=>x.date).filter(Boolean).sort();
  const period=dates.length?`${dates[0]} ~ ${dates[dates.length-1]}`:"";

  let h=`<h2 style="border-left-color:#ffd166">📊 나의 분석 리포트</h2>`;
  h+=`<p class="k">제출 ${subs.length}회${period?` · ${esc(period)}`:""} · 총 오답 ${totalWrong}개${repeated.length?` · 반복 결손 단원 ${repeated.length}개`:""}</p>`;

  h+=`<div class="cards"><div class="card"><b>${subs.length}</b><div class="k">제출 회차</div></div>`+
     `<div class="card"><b>${avg==null?"-":avg}</b><div class="k">평균 자기채점</div></div>`+
     `<div class="card"><b>${totalWrong}</b><div class="k">총 오답</div></div>`+
     `<div class="card"><b>${repeated.length}</b><div class="k">반복 결손</div></div></div>`;

  h+=`<h2>① 회차별 결과</h2><table><tr><th>시험</th><th>회차</th><th>날짜</th><th>자기채점</th></tr>`;
  scored.forEach(x=>{h+=`<tr><td>${esc(x.name)}</td><td>${esc(x.attempt)}회</td><td>${esc(x.date||"-")}</td><td>${x.score==null?"-":esc(x.score)}</td></tr>`;});
  h+=`</table>`;

  h+=`<h2>② 영역·단원 분석</h2>`;
  const arKeys=Object.keys(byArea);
  if(arKeys.length)h+=`<div style="margin:4px 0"><b>영역별 정답률</b> — `+arKeys.map(a=>`${esc(a)} ${pct(byArea[a][0],byArea[a][1])}`).join(" · ")+`</div>`;
  if(byFreq.length){
    h+=`<div class="k" style="margin-top:6px">자주 틀린 단원</div><table><tr><th>단원</th><th>오답</th><th>반복</th></tr>`;
    byFreq.slice(0,6).forEach(u=>{h+=`<tr><td>${esc(u.unit)}</td><td>${u.wrong}개</td><td>${u.exams>=2?`<span class="anchor">★ ${u.exams}개 회차</span>`:"-"}</td></tr>`;});
    h+=`</table>`;
  } else { h+=`<p class="k">단원 정보가 있는 오답이 아직 없어요(직접입력 회차만 있을 수 있어요).</p>`; }
  if(topReasons.length)h+=`<div style="margin-top:8px"><b>자주 고른 오답 원인</b> — `+topReasons.slice(0,4).map(r=>`${esc(r)}(${reasonCount[r]})`).join(" · ")+`</div>`;
  if(topSkills.length)h+=`<div style="margin-top:6px"><b>보강이 필요한 핵심 스킬</b><br>`+topSkills.map(s=>`<span class="anchor">⚡ ${esc(s)}</span>`).join(" ")+`</div>`;

  h+=`<h2>③ 공부 순서 <span class="k">(반복 결손·기초 단원부터)</span></h2>`;
  if(study.length){
    h+=`<ol class="ol">`;
    study.forEach(u=>{const top=Object.keys(u.skills||{}).sort((a,b)=>u.skills[b]-u.skills[a])[0];
      h+=`<li><b>${esc(u.unit)}</b>${u.exams>=2?`<span class="rep-tag">반복 ${u.exams}회차</span>`:""} <span class="k">· 오답 ${u.wrong}개</span>${top?`<br><span class="anchor">⚡ ${esc(top)}</span> <span class="k">먼저 잡기</span>`:""}</li>`;});
    h+=`</ol><p class="k">기초(상류) 단원과 반복해서 뚫린 단원을 먼저 메우면 점수가 가장 빠르게 오릅니다.</p>`;
  } else { h+=`<p class="k">아직 단원별 오답이 충분치 않아요. 오답노트를 더 쌓으면 순서를 제시해 드려요.</p>`; }

  h+=`<h2>④ 공부 방향</h2>`;
  if(repeated.length)h+=`<div class="dir"><b>반복 결손 우선</b> — ${repeated.slice(0,3).map(u=>esc(u.unit)).join(" · ")}${repeated.length>3?" 등":""}은 여러 회차에서 반복해 틀렸어요. <b>이 단원부터</b> 핵심 스킬을 잡고 같은 유형 대표문항 3~5개로 굳히세요.</div>`;
  if(topReasons.length){
    h+=`<div class="k" style="margin-top:6px">오답 원인별 처방</div>`;
    topReasons.slice(0,3).forEach(r=>{const fix=REASONFIX[r];if(fix)h+=`<div class="dir"><b>${esc(r)}</b> → ${esc(fix)}</div>`;});
  }
  h+=`<div class="dir">다음 회차에서 같은 단원이 또 틀리는지 확인하고, 2회 연속 맞으면 다음 순서 단원으로 넘어가세요.</div>`;
  h+=`<p class="k" style="margin-top:8px">* 입력하신 자기채점·오답 원인과 회차별 요구 스킬을 바탕으로 자동 생성된 리포트입니다.</p>`;
  h+=`<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="sm" id="repPrint">🖨️ 인쇄 · PDF 저장</button><button class="sm" id="repClose">닫기</button></div>`;

  rep.innerHTML=h;
  done("📊 리포트 다시 생성");
  const rp=document.getElementById("repPrint"); if(rp)rp.onclick=()=>window.print();
  const rc=document.getElementById("repClose"); if(rc)rc.onclick=()=>{rep.innerHTML="";if(btn)btn.textContent="📊 분석 리포트 받기";};
  rep.scrollIntoView({behavior:"smooth",block:"start"});
}

boot();
</script>
</body>
</html>
