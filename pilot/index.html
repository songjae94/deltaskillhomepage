/* ---------- 진단 ---------- */
function card(q){const g=graded(q);
 let ansUI=q.fmt==="c"?`<div class="chips">`+CHIP.map(c=>`<button class="chip ${S.ans[q.no]===c?'on':''}" data-a="${c}">${c}</button>`).join("")+`</div>`:`<input class="numin" inputmode="numeric" placeholder="답 입력" value="${S.ans[q.no]??''}" data-num="1">`;
 let badge=g?`<span class="badge ${g}">${g==='o'?'정답':'오답'}</span>`:"";
 let diag=(S.ans[q.no]!=null&&S.ans[q.no]!=="")?`<div class="diag">${g==='x'?`${q.steps?`<div class="dlab">어디까지 갔나요?</div><div class="rchips" style="margin-bottom:9px">`+["손도 못 댐"].concat(q.steps.map((s,i)=>(i+1)+". "+s)).concat(["다 풀었는데 답 틀림"]).map(s=>`<span class="rchip ${S.step[q.no]===s?'on':''}" data-st="${esc(s)}">${s}</span>`).join("")+`</div>`:""}<div class="dlab">${q.steps?'막힌 이유는?':'왜 틀렸나요?'} (한 번 탭)</div><div class="rchips">`+REASONS.map(r=>`<span class="rchip ${S.reason[q.no]===r?'on':''}" data-r="${r}">${r}</span>`).join("")+`</div><input class="memo" placeholder="막힌 지점 한 줄 (선택)" value="${esc(S.memo[q.no])}" data-memo="1"><div style="margin-top:8px">${S.photo[q.no]?`<span class="rchip on" data-phx="1">풀이 사진 첨부됨 · 탭하면 제거</span>`:`<span class="rchip" data-ph="1">풀이 사진 첨부 (선택)</span>`}</div>`:`<div class="dlab">확신도</div><div class="rchips">`+["확신함","애매함","찍음"].map(r=>`<span class="rchip ${S.conf[q.no]===r?'on':''}" data-c="${r}">${r}</span>`).join("")+`</div>`}</div>`:"";
 const d=document.createElement("div");d.className="q";d.innerHTML=`<div class="qh"><span class="qno">${q.no}</span><span class="qmeta"><b>${q.unit}</b> · ${q.topic} · ${q.jum}점 · ${q.fmt==='c'?'객관식':'단답'}</span>${badge}</div>${ansUI}${diag}`;
 d.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.ans[q.no]=b.dataset.a;refresh();});
 const num=d.querySelector("[data-num]");if(num){num.oninput=e=>{S.ans[q.no]=e.target.value.trim();};num.onblur=()=>refresh();}
 d.querySelectorAll("[data-r]").forEach(c=>c.onclick=()=>{S.reason[q.no]=c.dataset.r;refresh();});
 d.querySelectorAll("[data-st]").forEach(c=>c.onclick=()=>{S.step[q.no]=c.dataset.st;refresh();});
 const ph=d.querySelector("[data-ph]");if(ph)ph.onclick=()=>pickPhoto(q);
 const phx=d.querySelector("[data-phx]");if(phx)phx.onclick=()=>{delete S.photo[q.no];refresh();};
 d.querySelectorAll("[data-c]").forEach(c=>c.onclick=()=>{S.conf[q.no]=c.dataset.c;refresh();});
 const m=d.querySelector("[data-memo]");if(m)m.oninput=e=>S.memo[q.no]=e.target.value;return d;}
function refresh(){const y=window.scrollY;quiz();window.scrollTo(0,y);setProg();updFab();}
function quiz(){const wrap=document.createElement("div");wrap.className="pad";
 wrap.innerHTML=`<div class="h" style="font-size:16px">답을 입력하세요</div><div class="desc">객관식은 번호 탭, 단답은 숫자 입력. 채점은 자동이에요.</div><div class="sechd">공통과목 (1–22)</div>`;
 const g1=document.createElement("div");EXAM.data.gong.forEach(q=>g1.appendChild(card(q)));wrap.appendChild(g1);
 wrap.insertAdjacentHTML("beforeend",`<div class="sechd">선택과목 · ${S.profile.subject} (23–30)</div>`);
 const g2=document.createElement("div");(S.profile.subject==="미적분"?EXAM.data.mi:EXAM.data.hw).forEach(q=>g2.appendChild(card(q)));wrap.appendChild(g2);
 el("screen").innerHTML="";el("screen").appendChild(wrap);updFab();}
function updFab(){const n=answeredCount();el("fab").innerHTML=`<button class="btn" id="sub" ${n>=1?"":"disabled"}>제출하고 진단 보기 (${n}/30)</button>`;if(n>=1)el("sub").onclick=submitDiag;}

async function pickPhoto(q){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
 inp.onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const img=await createImageBitmap(f);const MAX=1280;const sc=Math.min(1,MAX/Math.max(img.width,img.height));
   const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);
   const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.72));
   S.photo[q.no]=blob||f;}
  catch(err){if(f.size<2097152)S.photo[q.no]=f;else{alert("사진 용량이 너무 커요. 밝은 곳에서 다시 찍어주세요.");return;}}
  refresh();};
 inp.click();}

async function submitDiag(){el("sub").disabled=true;el("sub").textContent="저장 중...";
 const res=buildResult();let mode="demo";
 try{ mode=await saveAll(res); }catch(e){ mode="error:"+(e&&e.message||e); }
 S.saveMode=mode;S.screen="result";render();window.scrollTo(0,0);}

function buildResult(){const its=items().filter(q=>graded(q)!=null);
 const correct=its.filter(q=>graded(q)==="o");const score=correct.reduce((s,q)=>s+q.jum,0);
 return {score,total:its.length,correct:correct.length,
   responses:its.map(q=>({item_no:q.no,area:q.area,unit:q.unit,my_answer:""+S.ans[q.no],correct_answer:""+q.ans,result:graded(q),reached_step:S.step[q.no]||null,reason:S.reason[q.no]||null,confidence:S.conf[q.no]||null,memo:S.memo[q.no]||null}))};}

async function sbPost(table,body,upsert){const r=await fetch(`${CONFIG.url}/rest/v1/${table}${upsert?"?on_conflict=id":""}`,{method:"POST",headers:{apikey:CONFIG.key,Authorization:"Bearer "+CONFIG.key,"Content-Type":"application/json",Prefer:"return=minimal"+(upsert?",resolution=merge-duplicates":"")},body:JSON.stringify(body)});if(!r.ok)throw new Error(table+" HTTP "+r.status);}
async function saveAll(res){
 if(CONFIG.url&&CONFIG.key){
   /* select 권한 없이도 동작하도록 ID를 클라이언트에서 생성 (return=minimal) */
   const ids=LS.get("ds_ids")||{};const sid=ids[S.phone]||uid();ids[S.phone]=sid;LS.set("ds_ids",ids);S.studentId=sid;
   try{await sbPost("students",{id:sid,phone:S.phone,name:S.profile.name,academy:S.profile.academy,grade:S.profile.grade,subject:S.profile.subject,consent:true,consent_marketing:S._consent2===true,consent_notify:S._consent3===true});}catch(e){if(!(""+e).includes("409"))throw e;/*409=이미 가입된 기기 → 정상*/}
   const subId=uid();
   await sbPost("submissions",{id:subId,student_id:sid,exam_code:EXAM.code,attempt_no:S.attempt,score:res.score});
   /* 풀이 사진 업로드 (실패해도 제출은 유지) */
   const okPhotos=new Set();
   for(const no of Object.keys(S.photo||{})){
     try{const r=await fetch(`${CONFIG.url}/storage/v1/object/solutions/${subId}/${no}.jpg`,{method:"POST",headers:{apikey:CONFIG.key,Authorization:"Bearer "+CONFIG.key,"Content-Type":"image/jpeg"},body:S.photo[no]});if(r.ok)okPhotos.add(+no);}catch(e){}
   }
   res.responses.forEach(x=>{x.photo_path=okPhotos.has(x.item_no)?subId+"/"+x.item_no+".jpg":null;});
   await sbPost("responses",res.responses.map(x=>({...x,submission_id:subId})));
   const subs=LS.get("ds_subs")||[];subs.push({phone:S.phone,exam:EXAM.code,attempt:S.attempt,score:res.score,mode:"server"});LS.set("ds_subs",subs);
   return "server";
 } else {
   const subs=LS.get("ds_subs")||[];subs.push({phone:S.phone,exam:EXAM.code,attempt:S.attempt,score:res.score,mode:"demo",responses:res.responses});LS.set("ds_subs",subs);
   return "demo";
 }}

/* ---------- 결과 ---------- */
function pathLocked(){const on=Math.min(S.attempt,3);return `<div class="lock"><div class="lg">🗺️</div><h4>학습 경로는 ${3-on>0?`${3-on}회 더 응시하면`:'곧'} 열려요</h4><p>한 번의 시험은 그날 컨디션이 섞여요. 3회가 쌓이면 <b>반복되는 결손</b>만 골라 개인 학습 경로를 만들어드려요.</p><div class="dots">${[0,1,2].map(i=>`<i class="${i<on?'on':''}"></i>`).join("")}</div><div style="font-size:12px;color:var(--mut2);margin-bottom:12px">현재 ${on}/3회</div><button class="btn ghost" id="pv" style="max-width:280px;margin:0 auto">3회 누적됐다고 가정하고 미리보기</button></div>`;}
function pathUnlocked(weak){const steps=weak.map(w=>w[0]).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));const body=steps.map((u,i)=>{const b=BANK[u]||{};return `<div class="step"><div class="stepn">${i+1}</div><div><div class="st"><b>${u}</b></div><div class="stt">${b.up?'상류 먼저 · ':''}${b.type||''}</div></div></div>`;}).join("");return `<div class="bar"><div style="font-size:11.5px;color:var(--ok);font-weight:700;margin-bottom:6px;letter-spacing:.03em">3회 누적 가정 · 반복 결손 기준</div><h4 style="margin-bottom:4px">${esc(S.profile.name)}님 학습 경로</h4><div style="font-size:12px;color:var(--mut);margin-bottom:8px">상류(기초)부터 순서대로 — 이 순서로 메우면 등급이 가장 빠르게 올라가요.</div>${body||'<div class="stt">약점이 뚜렷하지 않아요 — 유지 학습!</div>'}<div style="font-size:11px;color:var(--mut);margin-top:10px">* 예시 화면. 실제로는 여러 주간 반복 결손으로 자동 생성·매주 갱신됩니다.</div></div>`;}
function result(){const its=items();const done=its.filter(q=>graded(q)!=null);const correct=done.filter(q=>graded(q)==="o");const score=correct.reduce((s,q)=>s+q.jum,0);
 const areas={};its.forEach(q=>{const g=graded(q);if(g==null)return;areas[q.area]=areas[q.area]||{o:0,n:0};areas[q.area].n++;if(g==="o")areas[q.area].o++;});
 const areaRows=Object.entries(areas).map(([k,v])=>{const p=Math.round(v.o/v.n*100);const col=p>=70?"linear-gradient(90deg,#3d7fe0,#7cb6ff)":p>=45?"linear-gradient(90deg,#c98a3a,#ffb27a)":"linear-gradient(90deg,#c9543a,#ff8f74)";return `<div class="row"><span class="nm">${k}</span><span class="tr"><i style="width:${p}%;background:${col}"></i></span><span class="pc">${p}%</span></div>`;}).join("");
 const uinfo={};its.forEach(q=>{const g=graded(q);if(g==null)return;const u=uinfo[q.unit]=uinfo[q.unit]||{n:0,wrong:[],reasons:{}};u.n++;if(g==="x"){u.wrong.push(q.no);const r=S.reason[q.no];if(r)u.reasons[r]=(u.reasons[r]||0)+1;}});
 const weak=Object.entries(uinfo).filter(([k,v])=>v.wrong.length>0).sort((a,b)=>(b[1].wrong.length-a[1].wrong.length)||(ORDER.indexOf(a[0])-ORDER.indexOf(b[0]))).slice(0,3);
 const presc=weak.map(([u,v])=>{const tr=Object.entries(v.reasons).sort((a,b)=>b[1]-a[1])[0];const rl=tr?tr[0]:null;const fix=rl?REASONFIX[rl]:"유형별 대표문항으로 감 잡기";const b=BANK[u]||{type:u,gichul:[]};return `<div class="presc"><div class="pu">${u}<span class="pw">${v.wrong.length}문항 틀림</span></div>${rl?`<div class="pr">주 원인: <b>${rl}</b></div>`:''}<div class="pl"><span class="ic">🎯</span><div><b>유형 학습</b> · ${b.type}<br>→ ${fix}</div></div><div class="pl"><span class="ic">🔁</span><div><b>이번 시험 다시 풀 문제</b><br>${EXAM.title} ${v.wrong.map(n=>n+'번').join(', ')}</div></div><div class="pl"><span class="ic">📚</span><div><b>기출 복습</b><br>${b.gichul.join(' / ')}</div></div>${b.up?`<div class="pl up"><span class="ic">⬆️</span><div><b>먼저 볼 것(상류 결손)</b><br>${b.up}</div></div>`:''}</div>`;}).join("")||`<div class="presc"><div class="pl"><span class="ic">🎉</span><div>틀린 문항이 거의 없어요! 유지 학습으로 충분해요.</div></div></div>`;
 const savedUI=S.saveMode==="server"?`<div class="saved">델타스킬 서버에 저장됐어요 · 매주 쌓여 학습 경로가 됩니다</div>`:(S.saveMode&&S.saveMode.startsWith("error")?`<div class="saved demo">서버 저장 실패(${S.saveMode}) — 브라우저에 임시 저장됨. 관리자에게 문의</div>`:`<div class="saved demo">저장 완료(데모=브라우저) · 서버 키를 넣으면 델타스킬 DB로 저장됩니다</div>`);
 const pathSec=S.previewPath?pathUnlocked(weak):pathLocked();
 el("screen").innerHTML=`<div class="pad">${savedUI}<div class="h">${esc(S.profile.name)}님 진단 결과</div><div class="desc">${EXAM.title} · ${S.profile.subject} · ${S.attempt}회차</div>
  <div class="kpirow"><div class="kpi"><div class="v">${score}<span style="font-size:14px;color:var(--mut2)">점</span></div><div class="l">자기채점 원점수 (100)</div></div><div class="kpi"><div class="v">${correct.length}<span style="font-size:14px;color:var(--mut2)">/${done.length}</span></div><div class="l">맞은 문항</div></div></div>
  <div class="bar"><h4>영역별 정답률</h4>${areaRows}</div>
  <div class="seclabel">이번 주 나의 처방</div>${presc}
  <div class="seclabel">나의 학습 경로</div>${pathSec}
  <div class="note">파일럿 · deltaskill.co.kr</div></div>`;
 const pv=el("pv");if(pv)pv.onclick=()=>{S.previewPath=true;result();window.scrollTo(0,el("screen").scrollHeight);};
 el("fab").innerHTML=`<button class="btn ghost" id="home">완료 · 처음으로</button>`;el("home").onclick=()=>{S={screen:"login",phone:"",profile:null,studentId:null,catSel:null,ans:{},reason:{},conf:{},memo:{},step:{},photo:{},previewPath:false,attempt:1,saveMode:null};render();window.scrollTo(0,0);};}
/* ---------- 브라우저 뒤로가기: 앱 내 화면 이동으로 처리 ---------- */
let HB=false;
function backable(){return S.screen==="signup"||S.screen==="quiz"||S.screen==="intro"||S.screen==="result"||(S.screen==="exam"&&S.catSel!=null);}
function goBack(){
 if(S.screen==="signup"){S.screen="login";return true;}
 if(S.screen==="quiz"){S.screen="intro";return true;}
 if(S.screen==="intro"){S.screen="exam";return true;}
 if(S.screen==="result"){S.ans={};S.reason={};S.conf={};S.memo={};S.step={};S.photo={};S.previewPath=false;S.saveMode=null;S.screen="exam";return true;}
 if(S.screen==="exam"&&S.catSel!=null){S.catSel=null;return true;}
 return false;}
function syncHist(){if(backable()&&!HB){try{history.pushState({ds:1},"");HB=true;}catch(e){}}}
window.addEventListener("popstate",e=>{
 if(e.state&&e.state.ds===1){HB=true;return;}
 HB=false;
 if(goBack()){render();window.scrollTo(0,0);}
});
try{history.replaceState({ds:0},"");}catch(e){}
render();
</script></body></html>
