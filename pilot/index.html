/* ---------- 내 정보 (로컬 + 서버) ----------
   로컬 프로필(ds_students)이 없으면 가입 화면이 뜬다. 그런데 /my/ 로그인은 이걸
   저장하지 않았기 때문에, 마이페이지에서 '수정하기'로 넘어온 사람이 이미 가입돼
   있는데도 가입 화면을 다시 채웠고 그때마다 같은 번호로 빈 계정이 생겼다.
   (2026-08-12 11행 병합 · 백엔드 v8과 DB 부분 UNIQUE 인덱스로도 함께 막는다)
   토큰이 있으면 서버(/profile)에서 받아 되살린다 — 가입 화면을 띄우지 않는다. */
function saveProfile(p){
 const all=LS.get("ds_students")||{};const prev=all[S.phone]||{};
 const id=prev.id||S.studentId||("stu_"+S.phone);
 all[S.phone]={id:id,phone:S.phone,profile:p,consent_at:prev.consent_at||new Date().toISOString()};
 LS.set("ds_students",all);S.profile=p;S.studentId=id;
}
async function fetchProfile(){
 if(!CONFIG.api||!TK.has())return null;
 try{const j=await api("/profile");return (j&&j.profile&&j.profile.subject)?j.profile:null;}catch(_){return null;}
}
async function recoverProfile(){
 if(S.profile&&S.profile.subject)return true;
 if(!TK.has())return false;
 const tph=localStorage.getItem("ds_tk_ph");if(tph&&tph!==S.phone)return false;
 const p=await fetchProfile();if(!p)return false;
 saveProfile({name:p.name||"",academy:p.academy||"",grade:p.grade||"",subject:p.subject});
 return true;
}

/* 진단질의(원장 A2 추출, deltamap dq) — 원본은 정답이 항상 (A)라 화면에서만 문항번호 기반
   고정 순열로 섞는다. why 문장이 원본 라벨(B는/C는)을 참조하므로 표시 기호로 함께 번역한다. */
const DQP=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]],DQS=["①","②","③"];
function dqUI(q){if(!q.dq||!q.dq.ch||q.dq.ch.length!==3)return "";
 const P=DQP[q.no%6],aIdx="ABC".indexOf(q.dq.a),sel=S.dq[q.no],done=sel!=null;
 const posOf=i=>DQS[P.indexOf(i)];
 const chips=P.map((oi,pos)=>{let cls="rchip";
  if(done){if(oi===aIdx)cls+=" dqok";else if(oi===sel)cls+=" dqno";}
  return `<span class="${cls}" data-dq="${oi}">${DQS[pos]} ${esc(q.dq.ch[oi])}</span>`;}).join("");
 const why=done?`<div class="dqwhy"><b>${sel===aIdx?"맞아요.":"정답은 "+posOf(aIdx)+"."}</b> ${esc(q.dq.why).replace(/([ABC])(?=는)/g,m=>posOf("ABC".indexOf(m)))}</div>`:"";
 return `<div class="dlab">${esc(q.dq.q)} (하나 탭 — 스스로 확인)</div><div class="rchips" style="margin-bottom:9px">${chips}</div>${why}`;}
function card(q){const g=graded(q);
 let ansUI=q.fmt==="c"?`<div class="chips">`+CHIP.map(c=>`<button class="chip ${S.ans[q.no]===c?'on':''}" data-a="${c}">${c}</button>`).join("")+`</div>`:`<div class="numrow"><input class="numin" inputmode="numeric" placeholder="답 입력 (숫자)" value="${S.ans[q.no]??''}" data-num="1"><button class="numgo${(S.ans[q.no]!=null&&S.ans[q.no]!=='')?' done':''}" data-go="1" ${(S.ans[q.no]!=null&&S.ans[q.no]!=='')?'':'disabled'}>${(S.ans[q.no]!=null&&S.ans[q.no]!=='')?'입력됨':'입력'}</button></div>`;
 let badge=g?`<span class="badge ${g}">${g==='o'?'정답':'오답'}</span>`:"";
 let dqB=dqUI(q);
 let diag=(S.ans[q.no]!=null&&S.ans[q.no]!=="")?`<div class="diag">${g==='x'?`${q.steps?`<div class="dlab">어디까지 갔나요?</div><div class="rchips" style="margin-bottom:9px">`+["손도 못 댐"].concat(q.steps.map((s,i)=>(i+1)+". "+s)).concat(["다 풀었는데 답 틀림"]).map(s=>`<span class="rchip ${S.step[q.no]===s?'on':''}" data-st="${esc(s)}">${esc(s)}</span>`).join("")+`</div>`:""}${dqB}<div class="dlab">${q.steps?'막힌 이유는?':'왜 틀렸나요?'} (한 번 탭)</div><div class="rchips">`+REASONS.map(r=>`<span class="rchip ${S.reason[q.no]===r?'on':''}" data-r="${r}">${r}</span>`).join("")+`</div><input class="memo" placeholder="막힌 지점 한 줄 (선택)" value="${esc(S.memo[q.no])}" data-memo="1"><div style="margin-top:8px">${S.photo[q.no]?`<span class="rchip on" data-phx="1">풀이 사진 첨부됨 · 탭하면 제거</span>`:`<span class="rchip" data-ph="1">풀이 사진 첨부 (선택)</span><div style="font-size:11px;color:var(--mut2);margin-top:5px;line-height:1.5">풀이 과정만 나오게 찍어 주세요 · 이름·학교는 가려 주세요</div>`}</div>`:`<div class="dlab">확신도</div><div class="rchips">`+["확신함","애매함","찍음"].map(r=>`<span class="rchip ${S.conf[q.no]===r?'on':''}" data-c="${r}">${r}</span>`).join("")+`</div>`}</div>`:"";
 const d=document.createElement("div");d.className="q";d.innerHTML=`<div class="qh"><span class="qno">${q.no}</span><span class="qmeta"><b>${q.unit}</b> · ${q.topic} · ${q.jum}점 · ${q.fmt==='c'?'객관식':'단답'}</span>${badge}</div>${ansUI}${diag}`;
 d.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.ans[q.no]=b.dataset.a;refresh();});
 const num=d.querySelector("[data-num]");const go=d.querySelector("[data-go]");
 if(num){const commit=()=>{const v=num.value.trim();if(v==="")return;S.ans[q.no]=v;refresh();};
  num.oninput=e=>{const v=e.target.value.trim();if(go){go.disabled=(v==="");go.classList.remove("done");go.textContent="입력";}};
  num.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();commit();}};
  if(go)go.onclick=commit;}
 d.querySelectorAll("[data-r]").forEach(c=>c.onclick=()=>{S.reason[q.no]=c.dataset.r;refresh();});
 d.querySelectorAll("[data-st]").forEach(c=>c.onclick=()=>{S.step[q.no]=c.dataset.st;refresh();});
 d.querySelectorAll("[data-dq]").forEach(c=>c.onclick=()=>{if(S.dq[q.no]!=null)return;S.dq[q.no]=+c.dataset.dq;refresh();});
 const ph=d.querySelector("[data-ph]");if(ph)ph.onclick=()=>pickPhoto(q);
 const phx=d.querySelector("[data-phx]");if(phx)phx.onclick=()=>{delete S.photo[q.no];refresh();};
 d.querySelectorAll("[data-c]").forEach(c=>c.onclick=()=>{S.conf[q.no]=c.dataset.c;refresh();});
 const m=d.querySelector("[data-memo]");if(m)m.oninput=e=>S.memo[q.no]=e.target.value;return d;}

 const d=document.createElement("div");d.className="q"+(guess?" gs":"");d.id="nc"+q.no;

   ["손도 못 댐"].concat(q.steps.map((s,i)=>(i+1)+". "+s)).concat([guess?"다 풀었는데 확신은 없었음":"다 풀었는데 답 틀림"])

 d.innerHTML=`<div class="qh"><span class="qno">${q.no}</span><span class="qmeta"><b>${esc(q.unit)}</b> · ${esc(q.topic)} · ${q.jum}점 · ${q.fmt==='c'?'객관식':'단답'}</span></div>
  <div class="stat"><button data-mk="x" class="${guess?'':'on'}">틀렸어요</button><button data-mk="g" class="${guess?'gon':''}">찍어서 맞았어요</button></div>
  ${guess?`<div class="hint" style="margin:-6px 2px 10px">점수에는 <b style="color:var(--ok)">맞은 것으로</b> 반영되고, 다시 볼 문항으로만 담겨요.</div>`:``}
  <div class="diag" style="border-top:0;padding-top:0;margin-top:0">${stepUI}${dqUI(q)}

  <div class="rchips">`+REASONS.map(r=>`<span class="rchip ${S.reason[q.no]===r?'on':''}" data-r="${r}">${r}</span>`).join("")+`</div>

  <div class="ndone"><button class="ib" data-in="1">입력 완료 · 다음 문항</button><button class="rm" data-rm="1">빼기</button></div></div>`;
 d.querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{S.mark[q.no]=b.dataset.mk;nrefresh();});
 d.querySelectorAll("[data-r]").forEach(c=>c.onclick=()=>{S.reason[q.no]=c.dataset.r;nrefresh();});
 d.querySelectorAll("[data-st]").forEach(c=>c.onclick=()=>{S.step[q.no]=c.dataset.st;nrefresh();});
 d.querySelectorAll("[data-dq]").forEach(c=>c.onclick=()=>{if(S.dq[q.no]!=null)return;S.dq[q.no]=+c.dataset.dq;nrefresh();});
 const ph=d.querySelector("[data-ph]");if(ph)ph.onclick=()=>pickPhoto(q);

 d.querySelector("[data-in]").onclick=()=>{S.open=null;nrefresh("grid");};
 d.querySelector("[data-rm]").onclick=()=>{delete S.mark[q.no];delete S.reason[q.no];delete S.step[q.no];delete S.dq[q.no];delete S.memo[q.no];delete S.photo[q.no];
   S.open=null;nrefresh("grid");};

function noteScreen(){

async function pickPhoto(q){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
 inp.onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const img=await createImageBitmap(f);const MAX=1280;const sc=Math.min(1,MAX/Math.max(img.width,img.height));
   const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);
   const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.72));
   S.photo[q.no]=blob||f;}
  catch(err){if(f.size<2097152)S.photo[q.no]=f;else{alert("사진 용량이 너무 커요. 밝은 곳에서 다시 찍어주세요.");return;}}
  (S.screen==="custom"?cf:refresh)();};
 inp.click();}

/* 오답만 체크 모드에서도 맞은 문항까지 전부 보낸다 — 영역별 정답률·리포트가 그대로 동작하도록 */

   responses:its.map(q=>({item_no:q.no,area:q.area,unit:q.unit,
     my_answer:nm?"":(""+S.ans[q.no]),correct_answer:""+q.ans,result:graded(q),
     reached_step:S.step[q.no]||null,reason:S.reason[q.no]||null,
     confidence:(nm&&markOf(q)==="g")?"찍음":(S.conf[q.no]||null),
     memo:S.memo[q.no]||null}))};}

/* ---- 회차 id 확보: 메모리 → localStorage → 서버 이력 순으로 조회 ----

let HISTC=null;

/* ---------- 브라우저 뒤로/앞으로: 화면별 히스토리로 정상 처리 ---------- */
/* 각 화면 위치를 history에 한 칸씩 쌓아, 보통 사이트처럼 뒤로/앞으로가 한 화면씩 이동한다.
   (기존 '트랩 1개' 방식은 뒤로가면 앱 위로 튀고 앞으로가기가 안 돼서 교체) */
let NAVPOP=false;   // popstate(뒤로/앞으로) 복원 중이면 render의 push를 막는다
function _pos(){return {s:S.screen, c:(S.catSel==null?null:S.catSel), e:(typeof EXAM!=="undefined"&&EXAM)?EXAM.code:null};}
function _samePos(a,b){return !!a&&!!b&&a.s===b.s&&a.c===b.c&&a.e===b.e;}
function syncHist(){
 if(NAVPOP){NAVPOP=false;return;}                     // 뒤로/앞으로로 온 렌더면 새 기록 안 남김
 var st=history.state, p=_pos();
 if(st&&st.p&&_samePos(st.p,p))return;                // 위치 그대로면 skip(같은 화면 리렌더)
 try{history.pushState({p:p},"");}catch(e){}           // 앞으로 진행 → 히스토리 한 칸 쌓기
}
window.addEventListener("popstate",function(e){
 var p=e.state&&e.state.p;
 if(!p)return;                                         // 시작점보다 앞이면 브라우저가 메인으로 이동
 NAVPOP=true;
 S.screen=p.s; S.catSel=p.c;
 if(p.e){var ex=EXAMS.filter(function(x){return x.code===p.e;})[0]; if(ex)EXAM=ex;}
 render(); window.scrollTo(0,0);
});
