<style>

body.qlight{--bg:#f5f7fb;--panel:#fff;--panel2:#eef2f8;--line:rgba(23,43,77,.13);--line2:rgba(23,43,77,.22);--ink:#0c1322;--mut:rgba(16,28,50,.82);--mut2:rgba(16,28,50,.62);--ok:#0f9d58;--no:#e0533a;--amber:#b9761b;color-scheme:light}body.qlight .top{background:rgba(245,247,251,.82)}body.qlight .prog{background:rgba(23,43,77,.10)}body.qlight .app:before{background:radial-gradient(58% 60% at 50% 0,rgba(90,162,255,.10),transparent 72%)}body.qlight .chip.on{color:#1c4fa0;background:rgba(90,162,255,.15);border-color:rgba(90,162,255,.5);box-shadow:inset 0 0 0 1px rgba(90,162,255,.22)}body.qlight .rchip{background:var(--panel2)}body.qlight .memo{background:var(--panel2)}body.qlight .numin:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #eef2f8 inset}</style></head><body><div class="app">
<div class="top"><div class="brand">델타<span>스킬</span></div><div class="sub" id="subttl">AI 오답노트 · 파일럿</div><div class="prog"><i id="pbar"></i></div></div>

<script>
/* ===== 서버 연결 설정: Supabase 프로젝트 만들면 아래 두 값만 채우면 실제 서버 저장됨 (비우면 데모=브라우저 저장) ===== */
const CONFIG={ api:"https://cvlrphtupjmaefahodgz.supabase.co/functions/v1/api" };
const TK={get:()=>localStorage.getItem("ds_tk")||"",set:t=>localStorage.setItem("ds_tk",t),has:()=>!!localStorage.getItem("ds_tk"),clear:()=>localStorage.removeItem("ds_tk")};
async function api(path,opt){opt=opt||{};const method=opt.method||"GET";const auth=opt.auth!==false;const h={"Content-Type":"application/json"};if(auth){const t=TK.get();if(!t)throw new Error("no_token");h["Authorization"]="Bearer "+t;}const r=await fetch(CONFIG.api+path,{method,headers:h,body:opt.body?JSON.stringify(opt.body):undefined});let j=null;try{j=await r.json();}catch(_){}if(r.status===401&&auth)TK.clear();if(!r.ok||!j||j.ok===false)throw new Error((j&&j.error)||("HTTP "+r.status));return j;}

{code:"SV27_03",title:"서바이벌 3회",desc:"2027학년도 시대인재 · 공통 22 + 선택 8",data:{"gong": [{"no": 1, "jum": 2, "fmt": "c", "area": "수학Ⅰ", "unit": "지수와 로그", "topic": "지수법칙 계산", "ans": "①"}, {"no": 2, "jum": 2, "fmt": "c", "area": "수학Ⅱ", "unit": "미분", "topic": "미분계수의 극한 정의", "ans": "④"}, {"no": 3, "jum": 3, "fmt": "c", "area": "수학Ⅰ", "unit": "수열", "topic": "시그마 공식 활용", "ans": "①"}, {"no": 4, "jum": 3, "fmt": "c", "area": "수학Ⅱ", "unit": "함수의 극한과 연속", "topic": "연속 조건과 좌우극한", "ans": "②"}, {"no": 5, "jum": 3, "fmt": "c", "area": "수학Ⅱ", "unit": "미분", "topic": "곱의 미분법", "ans": "④"}, {"no": 6, "jum": 3, "fmt": "c", "area": "수학Ⅰ", "unit": "삼각함수", "topic": "삼각함수 각의 변환·부호", "ans": "②"}, {"no": 7, "jum": 3, "fmt": "c", "area": "수학Ⅰ", "unit": "지수와 로그", "topic": "지수함수 위 두 점의 거리", "ans": "③"}, {"no": 8, "jum": 3, "fmt": "c", "area": "수학Ⅱ", "unit": "적분", "topic": "정적분 조건으로 미지수 결정", "ans": "③"}, {"no": 9, "jum": 4, "fmt": "c", "area": "수학Ⅰ", "unit": "수열", "topic": "두 등차수열의 대응 조건", "ans": "③", "steps": ["a_k=b_k에서 두 수열의 첫째항이 같음을 확인", "a_{2k+2}=b_k를 a₁+(2k+1)k=a₁+(k−1)(3k)로 전개", "2k+1=3(k−1)을 풀어 k=4 도출", "a_k=6으로 a₁=−6 구해 b₃ 계산"]}, {"no": 10, "jum": 4, "fmt": "c", "area": "수학Ⅱ", "unit": "미분", "topic": "접선과 새 함수의 접함 조건", "ans": "④", "steps": ["f(0)=k, f′(0)=3이므로 접선 g(x)=3x+k", "g(2x)−g(x)=3x로 정리", "y=3x가 f에 접하므로 f′(p)=3에서 p=0 또는 2", "p=0은 k>0에 모순이므로 p=2에서 k=4"]}, {"no": 11, "jum": 4, "fmt": "c", "area": "수학Ⅱ", "unit": "적분", "topic": "속도와 움직인 거리", "ans": "④", "steps": ["ㄱ: v₁(1)=v₂(1)에서 k=2 확인", "ㄴ: v₁=0의 두 근의 곱이 음수→양수근 1개뿐", "ㄷ: k=2로 두 속도를 인수분해해 부호 변화 지점 파악", "구간을 나눠 |속도|를 적분해 거리 합 47/3"], "pat": "SIGN"}, {"no": 12, "jum": 4, "fmt": "c", "area": "수학Ⅰ", "unit": "삼각함수", "topic": "사인·코사인법칙과 외접원", "ans": "②", "steps": ["sin 비가 2:3이므로 AC=2k, BC=3k로 설정", "삼각형 ABC에 코사인법칙 적용해 k=2 도출", "AC=CD=4이므로 삼각형 ADC에서 AD=√14", "사인법칙으로 외접원 반지름 구해 넓이 계산"]}, {"no": 13, "jum": 4, "fmt": "c", "area": "수학Ⅱ", "unit": "적분", "topic": "정적분 방정식의 세 실근", "ans": "②", "steps": ["∫₀ˣf(t)dt=0이 항상 x=0을 근으로 가짐을 인지", "세 실근 a, b, a+b 중 하나가 0이므로 b=−a", "∫₀ˣf(t)dt=kx(x−a)(x+a)로 설정", "적분 조건 대입해 a=−√3, k=√3/2 구해 f(3) 계산"]}, {"no": 14, "jum": 4, "fmt": "c", "area": "수학Ⅰ", "unit": "지수와 로그", "topic": "로그함수와 삼각형 넓이", "ans": "③", "steps": ["log₃x=k에서 A(3^k,k), B(3^{k−1},k) 좌표 설정", "두 삼각형 넓이가 같음에서 q=3p 도출", "D, E가 y=2^x+k 위에 있음을 이용해 두 식 연립", "2^{2p}=3에서 p와 m 구하고 k=3/2 계산"]}, {"no": 15, "jum": 4, "fmt": "c", "area": "수학Ⅱ", "unit": "미분", "topic": "부등식 조건과 삼차함수 결정", "ans": "②", "steps": ["k=0,1 대입해 f(0)=0, f(1)=0, f(−1)≤0 도출", "최고차항이 양수면 k→∞에서 모순→음의 정수", "f(x)=ax(x−1)(x−b)로 놓고 b의 범위 확정", "f′(−1)=5로 a=−3 찾아 f′(1) 최댓값 계산"]}, {"no": 16, "jum": 3, "fmt": "s", "area": "수학Ⅰ", "unit": "수열", "topic": "귀납적 정의로 항 구하기", "ans": 16}, {"no": 17, "jum": 3, "fmt": "s", "area": "수학Ⅱ", "unit": "적분", "topic": "도함수로부터 함수 복원", "ans": 4}, {"no": 18, "jum": 3, "fmt": "s", "area": "수학Ⅰ", "unit": "지수와 로그", "topic": "지수·로그 방정식 연립", "ans": 9}, {"no": 19, "jum": 3, "fmt": "s", "area": "수학Ⅱ", "unit": "미분", "topic": "극값 조건으로 함수 결정", "ans": 10}, {"no": 20, "jum": 4, "fmt": "s", "area": "수학Ⅰ", "unit": "수열", "topic": "시그마 점화식 빈칸추론", "ans": 100, "steps": ["주어진 식의 n+1 버전에서 n 버전을 뺌", "정리해 a_{n+2}=16n/(n+4)×a_n 형태 (가) 도출", "b_n 치환으로 b_{n+2}=4b_n 얻어 (나)=4", "홀수·짝수항 나눠 (다) 구하고 p+f(4)g(3) 계산"], "pat": "CASE"}, {"no": 21, "jum": 4, "fmt": "s", "area": "수학Ⅱ", "unit": "함수의 극한과 연속", "topic": "극한 존재조건과 판별식", "ans": 78, "steps": ["분모가 0인 x=0,1에서 극한이 존재해야 함을 파악", "g(0)=g(1)=0에서 f(x)−kx=x(x−1)(x−c) 설정", "x=0의 좌우극한을 일치시켜 k=−2c 도출", "판별식 D≤0으로 c 범위 구해 f(3) 최댓값 계산"], "pat": "LIMIT"}, {"no": 22, "jum": 4, "fmt": "s", "area": "수학Ⅰ", "unit": "삼각함수", "topic": "평행 조건과 삼각방정식 치환", "ans": 23, "steps": ["AB와 CD가 평행이므로 y=mx+k, y=mx+k′로 설정", "t=(3π−x)/2 치환으로 cos식을 sin 방정식으로 통일", "근의 대응에서 a, b를 c, d로 표현", "CD=(12/7)BP 조건 대입해 b, c 구하고 p+q 계산"]}], "mi": [{"no": 23, "jum": 2, "fmt": "c", "area": "미적분(선택)", "unit": "미분법", "topic": "로그함수의 극한", "ans": "②"}, {"no": 24, "jum": 3, "fmt": "c", "area": "미적분(선택)", "unit": "적분법", "topic": "삼각함수의 정적분", "ans": "②"}, {"no": 25, "jum": 3 동 관계임을 파악", "f(1)=g(2/t)에서 |1/t−1|=|5−2/t|를 세워 t 후보 도출", "P(X≤−1)≤P(Y≤1) 조건으로 t=1/4 확정", "N(4,(1/4)²)에서 P(X≥7/2)를 표준화해 1000k 계산"]}, {"no": 30, "jum": 4, "fmt": "s", "area": "확률과통계", "unit": "확률", "topic": "독립시행과 조건부확률", "ans": 25, "steps": ["주사위 눈 1~6별로 A·B 상자에 넣는 규칙을 표로 정리", "a×b=16에서 (a,b)=(2,8) 또는 (4,4) 두 경우로 분류", "각 경우를 같은 것이 있는 순열로 확률 계산", "두 확률의 비로 조건부확률 8/17 구해 p+q 계산"], "pat": "REPEAT"}]}},

으로 정리", "적분 계산해 15/16 도출"]}, {"no": 14, "jum": 4, "fmt": "c", "area": "수학Ⅰ", "unit": "삼각함수", "topic": "평행이동 관계와 넓이", "ans": "①", "steps": ["두 구간의 식에서 f(x+1/2)=f(x)+1 관계를 발견", "평행이동 기울기가 2이므로 AB=√5/2 도출", "삼각형 넓이 2/3로 C의 x좌표 4/3 계산", "f(4/3)=0을 풀어 a 계산"]}, {"no": 15, "jum": 4, "fmt": "c", "area": "수학Ⅱ", "unit": "미분", "topic": "극한으로 정의된 함수의 정의역", "ans": "②", "steps": ["극한을 정리해 h(x)=f′(a)/f′(x)임을 도출", "h가 실수 전체에서 정의되려면 f′(x)≠0", "f′>0이면 발산 성질에 모순이므로 f′<0 확정", "조건 (나)의 근의 곱이 1에서 a=3 구해 f(−1) 계산"]}, {"no": 16, "jum": 3, "fmt": "s", "area": "수학Ⅰ", "unit": "지수와 로그", "topic": "로그방정식", "ans": 4}, {"no": 17, "jum": 3, "fmt": "s", "area": "수학Ⅱ", "unit": "미분", "topic": "곱의 미분법", "ans": 2}, {"no": 18, "jum": 3, "fmt": "s", "area": "수학Ⅰ", "unit": "수열", "topic": "시그마 전개", "ans": 101}, {"no": 19, "jum": 3, "fmt": "s", "area": "수학Ⅱ", "unit": "적분", "topic": "속도와 움직인 거리", "ans": 10}, {"no": 20, "jum": 4, "fmt": "s", "area": "수학Ⅰ", "unit": "지수와 로그", "topic": "지수·로그 그래프 빈칸추론", "ans": 288, "steps": ["A의 x좌표 α가 α²+log_b α=2를 만족함을 확인", "B의 x좌표 β가 β=α²임을 도출", "직선 AB의 기울기 32/3에서 α=6/5 계산", "p, q, f(α)를 구해 100×p×f(q) 계산"]}, {"no": 21, "jum": 4, "fmt": "s", "area": "수학Ⅱ", "unit": "적분", "topic": "정적분으로 정의된 함수", "ans": 12, "steps": ["조건 (가)를 g(n)+g(n−1)=0으로 변형", "g(0)>0이면 부호가 교대해 근이 늘어나 (나)에 모순", "g(0)=g(1)=g(2)=g(3)=0으로 g의 식을 특정", "f(a)<0 조건으로 a=2 찾고 g(4)−g(1) 계산"]}, {"no": 22, "jum": 4, "fmt": "s", "area": "수학Ⅰ", "unit": "수열", "topic": "귀납적 정의의 규칙 발견", "ans": 176, "steps": ["a_{2n}=a_n, a_{2n+1}=a_n+2에서 값의 집합이 홀수 전체임을 파악", "S_{b_n}=S_{a_n+1}+1에서 b_{2n}=a_n+2, b_{b_n}=1 도출", "3 이상 홀수에서 b_n=1이므로 b_k+b_{k+1}=8은 a_m=5 부근", "k=2m−1, 2m 규칙으로 k≤32인 값들의 합 계산"], "pat": "CASE"}], "mi": [{"no": 23, "jum": 2, "fmt": "c", "area": "미적분(선택)", "unit": "수열의 극한", "topic": "무리식 수열의 극한", "ans": "②"}, {"no": 24, "jum": 3, "fmt": "c", "area": "미적분(선택)", "unit": "적분법", "topic": "삼각함수의 정적분", "ans": "①"}, {"no": 25, "jum": 3, "fmt": "c", "area": "미적분(선택)", "unit": "미분법", "topic": "매개변수로 나타낸 함수의 미분", "ans": "④"}, {"no"  }
 const c=CATS[S.catSel];
 el("screen").innerHTML=`<div class="pad"><div style="margin-bottom:10px"><span class="rchip" data-back="1" style="cursor:pointer">← 분류 다시 선택</span></div><div class="h">${c.name}</div>
 <div class="desc">${c.desc} — 회차를 선택하세요.</div>`+

 }).join("")+`</div>`;

function card(q){const g=graded(q);
 let ansUI=q.fmt==="c"?`<div class="chips">`+CHIP.map(c=>`<button class="chip ${S.ans[q.no]===c?'on':''}" data-a="${c}">${c}</button>`).join("")+`</div>`:`<input class="numin" inputmode="numeric" placeholder="답 입력" value="${S.ans[q.no]??''}" data-num="1">`;
 let badge=g?`<span class="badge ${g}">${g==='o'?'정답':'오답'}</span>`:"";
 let diag=(S.ans[q.no]!=null&&S.ans[q.no]!=="")?`<div class="diag">${g==='x'?`${q.steps?`<div class="dlab">어디까지 갔나요?</div><div class="rchips" style="margin-bottom:9px">`+["손도 못 댐"].concat(q.steps.map((s,i)=>(i+1)+". "+s)).concat(["다 풀었는데 답 틀림"]).map(s=>`<span class="rchip ${S.step[q.no]===s?'on':''}" data-st="${esc(s)}">${s}</span>`).join("")+`</div>`:""}<div class="dlab">${q.steps?'막힌 이유는?':'왜 틀렸나요?'} (한 번 탭)</div><div class="rchips">`+REASONS.map(r=>`<span class="rchip ${S.reason[q.no]===r?'on':''}" data-r="${r}">${r}</span>`).join("")+`</div><input class="memo" placeholder="막힌 지점 한 줄 (선택)" value="${esc(S.memo[q.no])}" data-memo="1"><div style="margin-top:8px">${S.photo[q.no]?`<span class="rchip on" data-phx="1">풀이 사진 첨부됨 · 탭하면 제거</span>`:`<span class="rchip" data-ph="1">풀이 사진 첨부 (선택)</span>`}</div>`:`<div class="dlab">확신도</div><div class="rchips">`+["확신함","애매함","찍음"].map(r=>`<span class="rchip ${S.conf[q.no]===r?'on':''}" data-c="${r}">${r}</span>`).join("")+`</div>`}</div>`:"";
 const d=document.createElement("div");d.className="q";d.innerHTML=`<div class="qh"><span class="qno">${q.no}</span><span class="qmeta"><b>${q.unit}</b> · ${q.topic} · ${q.jum}점 · ${q.fmt==='c'?'객관식':'단답'}</span>${badge}</div>${ansUI}${diag}`;
 d.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.ans[q.no]=b.dataset.a;refresh();});
 const num=d.querySelector("[data-num]");if(num){num.oninput=e=>{S.ans[q.no]=e.target.value.trim();};num.onblur=()=>refresh();}
 d.querySelectorAll("[data-r]").forEach(c=>c.onclick=()=>{S.reason[q.no]=c.dataset.r;refresh();});
 d.querySelectorAll("[data-st]").forEach(c=>c.onclick=()=>{S.step[q.no]=c.dataset.st;refresh();});
 const ph=d.querySelector("[data-ph]");if(ph)ph.onclick=()=>pickPhoto(q);
 const phx=d.querySelector("[data-phx]");if(phx)phx.onclick=()=>{delete S.photo[q.no];refresh();};
 d.querySelectorAll("[data-c]").forEach(c=>c.onclick=()=>{S.conf[q.no]=c.dataset.c;refresh();});
 const m=d.querySelector("[data-memo]");if(m)m.oninput=e=>S.memo[q.no]=e.target.value;return d;}
function refresh(){const y=window.scrollY;quiz();window.scrollTo(0,y);setProg();updFab();}
function quiz(){const wrap=document.createElement("div");wrap.className="pad";
 wrap.innerHTML=`<div class="h" style="font-size:16px">답을 입력하세요</div><div class="desc">객관식은 번호 탭, 단답은 숫자 입력. 채점은 자동이에요.</div><div class="sechd">공통과목 (1–22)</div>`;
 const g1=document.createElement("div");EXAM.data.gong.forEach(q=>g1.appendChild(card(q)));wrap.appendChild(g1);
 wrap.insertAdjacentHTML("beforeend",`<div class="sechd">선택과목 · ${S.profile.subject} (23–30)</div>`);
 const g2=document.createElement("div");(S.profile.subject==="미적분"?EXAM.data.mi:EXAM.data.hw).forEach(q=>g2.appendChild(card(q)));wrap.appendChild(g2);
 el("screen").innerHTML="";el("screen").appendChild(wrap);updFab();}
function updFab(){const n=answeredCount();el("fab").innerHTML=`<button class="btn" id="sub" ${n>=1?"":"disabled"}>제출하고 결과 보기 (${n}/30)</button>`;if(n>=1)el("sub").onclick=submitDiag;}

async function pickPhoto(q){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
 inp.onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const img=await createImageBitmap(f);const MAX=1280;const sc=Math.min(1,MAX/Math.max(img.width,img.height));
   const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);
   const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.72));
   S.photo[q.no]=blob||f;}
  catch(err){if(f.size<2097152)S.photo[q.no]=f;else{alert("사진 용량이 너무 커요. 밝은 곳에서 다시 찍어주세요.");return;}}
  (S.screen==="custom"?cf:refresh)();};
 inp.click();}

async function submitDiag(){el("sub").disabled=true;el("sub").textContent="저장 중...";
 const res=buildResult();let mode="demo";
 try{ mode=await saveAll(res); }catch(e){ mode="error:"+(e&&e.message||e); }
 S.saveMode=mode;S.screen="result";render();window.scrollTo(0,0);}

function buildResult(){const its=items().filter(q=>graded(q)!=null);
 const correct=its.filter(q=>graded(q)==="o");const score=correct.reduce((s,q)=>s+q.jum,0);
 return {score,total:its.length,correct:correct.length,
   responses:its.map(q=>({item_no:q.no,area:q.area,unit:q.unit,my_answer:""+S.ans[q.no],correct_answer:""+q.ans,result:graded(q),reached_step:S.step[q.no]||null,reason:S.reason[q.no]||null,confidence:S.conf[q.no]||null,memo:S.memo[q.no]||null}))};}

async function saveAll(res,examCode){examCode=examCode||EXAM.code;
 const demoSave=()=>{const subs=LS.get("ds_subs")||[];subs.push({phone:S.phone,exam:examCode,attempt:S.attempt,score:res.score,mode:"demo",responses:res.responses});LS.set("ds_subs",subs);};
 if(!CONFIG.api){demoSave();return "demo";}
 try{
   if(!TK.has()){
     const pin=S._pin||"";
     if(!/^\d{4}$/.test(pin))throw new Error("need_pin");
     try{
       const j=await api("/enroll",{method:"POST",auth:false,body:{phone:S.phone,pin:pin,name:S.profile.name,academy:S.profile.academy,grade:S.profile.grade,subject:S.profile.subject,consent:true,consent_marketing:S._consent2===true,consent_notify:S._consent3===true}});
       TK.set(j.token);
     }catch(e){
       const m=""+(e&&e.message||e);
       if(/already_enrolled/.test(m)){const j=await api("/login",{method:"POST",auth:false,body:{phone:S.phone,pin:pin}});TK.set(j.token);}
       else throw e;
     }
   }
   const sub=await api("/submit",{method:"POST",body:{exam_code:examCode,attempt_no:S.attempt,score:res.score,responses:res.responses}});
   const subId=sub.submission_id;S.studentId=subId;
   const failed=[];
   for(const no of Object.keys(S.photo||{})){
     try{const s=await api("/photo-upload",{method:"POST",body:{submission_id:subId,item_no:+no}});const r=await fetch(s.url,{method:"PUT",headers:{"Content-Type":"image/jpeg","x-upsert":"true"},body:S.photo[no]});if(!r.ok)throw 0;}
     catch(_){failed.push(+no);}
   }
   S._photoFailed=failed;
   const subs=LS.get("ds_subs")||[];subs.push({phone:S.phone,exam:examCode,attempt:S.attempt,score:res.score,mode:"server"});LS.set("ds_subs",subs);
   return "server";
 }catch(e){ demoSave(); throw e; }
}

/* ---------- 결과 ---------- */
function pathLocked(){const on=Math.min(S.attempt,3);return `<div class="lock"><div class="lg">🗺️</div><h4>학습 경로는 ${3-on>0?`${3-on}회 더 응시하면`:'곧'} 열려요</h4><p>한 번의 시험은 그날 컨디션이 섞여요. 3회가 쌓이면 <b>반복되는 결손</b>만 골라 개인 학습 경로를 만들어드려요.</p><div class="dots">${[0,1,2].map(i=>`<i class="${i<on?'on':''}"></i>`).join("")}</div><div style="font-size:12px;color:var(--mut2);margin-bottom:12px">현재 ${on}/3회</div><button class="btn ghost" id="pv" style="max-width:280px;margin:0 auto">3회 누적됐다고 가정하고 미리보기</button></div>`;}
function pathUnlocked(weak){const steps=weak.map(w=>w[0]).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));const body=steps.map((u,i)=>{const b=BANK[u]||{};return `<div class="step"><div class="stepn">${i+1}</div><div><div class="st"><b>${u}</b></div><div class="stt">${b.up?'상류 먼저 · ':''}${b.type||''}</div></div></div>`;}).join("");return `<div class="bar"><div style="font-size:11.5px;color:var(--ok);font-weight:700;margin-bottom:6px;letter-spacing:.03em">3회 누적 가정 · 반복 결손 기준</div><h4 style="margin-bottom:4px">${esc(S.profile.name)}님 학습 경로</h4><div style="font-size:12px;color:var(--mut);margin-bottom:8px">상류(기초)부터 순서대로 — 이 순서로 메우면 등급이 가장 빠르게 올라가요.</div>${body||'<div class="stt">약점이 뚜렷하지 않아요 — 유지 학습!</div>'}<div style="font-size:11px;color:var(--mut);margin-top:10px">* 예시 화면. 실제로는 여러 주간 반복 결손으로 자동 생성·매주 갱신됩니다.</div></div>`;}
function result(){const its=items();const done=its.filter(q=>graded(q)!=null);const correct=done.filter(q=>graded(q)==="o");const score=correct.reduce((s,q)=>s+q.jum,0);
 const areas={};its.forEach(q=>{const g=graded(q);if(g==null)return;areas[q.area]=areas[q.area]||{o:0,n:0};areas[q.area].n++;if(g==="o")areas[q.area].o++;});
 const areaRows=Object.entries(areas).map(([k,v])=>{const p=Math.round(v.o/v.n*100);const col=p>=70?"linear-gradient(90deg,#3d7fe0,#7cb6ff)":p>=45?"linear-gradient(90deg,#c98a3a,#ffb27a)":"linear-gradient(90deg,#c9543a,#ff8f74)";return `<div class="row"><span class="nm">${k}</span><span class="tr"><i style="width:${p}%;background:${col}"></i></span><span class="pc">${p}%</span></div>`;}).join("");
 const uinfo={};its.forEach(q=>{const g=graded(q);if(g==null)return;const u=uinfo[q.unit]=uinfo[q.unit]||{n:0,wrong:[],reasons:{}};u.n++;if(g==="x"){u.wrong.push(q.no);const r=S.reason[q.no];if(r)u.reasons[r]=(u.reasons[r]||0)+1;}});
 const weak=Object.entries(uinfo).filter(([k,v])=>v.wrong.length>0).sort((a,b)=>(b[1].wrong.length-a[1].wrong.length)||(ORDER.indexOf(a[0])-ORDER.indexOf(b[0]))).slice(0,3);
 const presc=weak.map(([u,v])=>{const tr=Object.entries(v.reasons).sort((a,b)=>b[1]-a[1])[0];const rl=tr?tr[0]:null;const fix=rl?REASONFIX[rl]:"유형별 대표문항으로 감 잡기";const b=BANK[u]||{type:u,gichul:[]};return `<div class="presc"><div class="pu">${u}<span class="pw">${v.wrong.length}문항 틀림</span></div>${rl?`<div class="pr">주 원인: <b>${rl}</b></div>`:''}<div class="pl"><span class="ic">🎯</span><div><b>유형 학습</b> · ${b.type}<br>→ ${fix}</div></div><div class="pl"><span class="ic">🔁</span><div><b>이번 시험 다시 풀 문제</b><br>${EXAM.title} ${v.wrong.map(n=>n+'번').join(', ')}</div></div><div class="pl"><span class="ic">📚</span><div><b>기출 복습</b><br>${b.gichul.join(' / ')}</div></div>${b.up?`<div class="pl up"><span class="ic">⬆️</span><div><b>먼저 볼 것(상류 결손)</b><br>${b.up}</div></div>`:''}</div>`;}).join("")||`<div class="presc"><div class="pl"><span class="ic">🎉</span><div>틀린 문항이 거의 없어요! 유지 학습으로 충분해요.</div></div></div>`;
 const savedUI=S.saveMode==="server"?`<div class="saved">델타스킬 서버에 저장됐어요 · 매주 쌓여 학습 경로가 됩니다</div>`:(S.saveMode&&S.saveMode.startsWith("error")?`<div class="saved demo">서버 저장 실패(${S.saveMode}) — 브라우저에 임시 저장됨. 관리자에게 문의</div>`:`<div class="saved demo">저장 완료(데모=브라우저) · 서버 키를 넣으면 델타스킬 DB로 저장됩니다</div>`);
 const pinfo={};its.forEach(q=>{const g=graded(q);if(g==null||!q.pat)return;const o=pinfo[q.pat]=pinfo[q.pat]||{n:0,wrong:[]};o.n++;if(g==="x")o.wrong.push(q.no);});
 const pweak=Object.entries(pinfo).filter(([k,v])=>v.wrong.length>0).sort((a,b)=>b[1].wrong.length-a[1].wrong.length).slice(0,2);
 const patSec=pweak.map(([k,v])=>{const b=PATBANK[k];if(!b)return"";return `<div class="presc"><div class="pu">${b.n}<span class="pw">이번 회차 ${v.wrong.length}문항</span></div><div class="pr">핵심 기술: <b>${b.k}</b></div><div class="pl"><span class="ic">🧩</span><div><b>같은 기술을 쓰는 문항 ${b.c}개</b><br>${b.d}</div></div><div class="pl"><span class="ic">🎯</span><div><b>묶어서 연습</b><br>${b.f}</div></div></div>`;}).join("");
 const pathSec=S.previewPath?pathUnlocked(weak):pathLocked();
 el("screen").innerHTML=`<div class="pad">${savedUI}<div class="h">${esc(S.profile.name)}님 오답노트 결과</div><div class="desc">${EXAM.title} · ${S.profile.subject} · ${S.attempt}회차</div>
  <div class="kpirow"><div class="kpi"><div class="v">${score}<span style="font-size:14px;color:var(--mut2)">점</span></div><div class="l">자기채점 원점수 (100)</div></div><div class="kpi"><div class="v">${correct.length}<span style="font-size:14px;color:var(--mut2)">/${done.length}</span></div><div class="l">맞은 문항</div></div></div>
  <div class="bar"><h4>영역별 정답률</h4>${areaRows}</div>
  <div class="seclabel">이번 주 나의 처방</div>${presc}
  ${patSec?`<div class="seclabel">묶어서 연습할 기술</div>`+patSec:""}
  <div class="seclabel">나의 학습 경로</div>${pathSec}
  <div class="note">파일럿 · deltaskill.co.kr</div></div>`;
 const pv=el("pv");if(pv)pv.onclick=()=>{S.previewPath=true;result();window.scrollTo(0,el("screen").scrollHeight);};
 el("fab").innerHTML=`<button class="btn ghost" id="home">완료 · 처음으로</button>`;el("home").onclick=()=>{S={screen:"login",phone:"",profile:null,studentId:null,catSel:null,ans:{},reason:{},conf:{},memo:{},step:{},photo:{},previewPath:false,attempt:1,saveMode:null};render();window.scrollTo(0,0);};}

 <div class="h">모의고사 직접입력</div>

  <div class="dlab">시험 이름</div><input class="memo" id="cnm" placeholder="예: 8월 서바이벌 3회" value="${esc(S._cName)}" style="width:100%;box-sizing:border-box">
  <div class="dlab" style="margin-top:10px">응시 날짜</div><input class="memo" id="cdt" type="date" value="${esc(S._cDate)}" style="width:100%;box-sizing:border-box">
  <div class="dlab" style="margin-top:10px">선택과목</div><div class="rchips">${["미적분","확률과통계"].map(x=>`<span class="rchip ${S._cSub===x?'on':''}" data-sub="${x}">${x}</span>`).join("")}</div>
  <div class="dlab" style="margin-top:10px">원점수 (100점 만점)</div><input class="memo" id="csc" inputmode="numeric" placeholder="예: 84" value="${S._cScore??''}" style="width:100%;box-sizing:border-box">
 </div>
 <div class="seclabel">틀린 문항 (탭해서 표시)</div>
 <div class="bar"><div class="dlab">공통 (1–22)</div><div class="rchips" style="gap:6px">${grid(1,22)}</div>
  <div class="dlab" style="margin-top:12px">선택 · ${S._cSub||''} (23–30)</div><div class="rchips" style="gap:6px">${grid(23,30)}</div>
  <div style="font-size:11.5px;color:var(--mut);margin-top:10px">틀린 문항을 탭한 뒤, 아래에서 그 문항에 <b>풀이 사진</b>을 붙일 수 있어요.</div></div>
 ${wl.length?`<div class="seclabel">오답 사진 (선택)</div><div class="bar">${wl.map(n=>`<div class="pl"><span class="ic">${n}번</span><div>${S.photo[n]?`<span class="rchip on" data-phx="${n}">첨부됨 · 탭하면 제거</span>`:`<span class="rchip" data-ph="${n}">사진 첨부</span>`}</div></div>`).join("")}</div>`:''}
 <div class="note">파일럿 · deltaskill.co.kr</div></div>`;
 el("cnm").oninput=e=>{S._cName=e.target.value;};
 el("cdt").oninput=e=>{S._cDate=e.target.value;};
 el("csc").oninput=e=>{S._cScore=e.target.value.replace(/[^0-9]/g,"").slice(0,3);e.target.value=S._cScore;};
 document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{S._cSub=b.dataset.sub;cf();});
 document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const n=+b.dataset.w;if(S._cWrong[n]){delete S._cWrong[n];delete S.photo[n];}else S._cWrong[n]=1;cf();});
 document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>pickPhoto({no:+b.dataset.ph}));
 document.querySelectorAll("[data-phx]").forEach(b=>b.onclick=()=>{delete S.photo[+b.dataset.phx];cf();});

 el("fab").innerHTML=`<button class="btn" id="csub">저장하기</button>`;el("csub").onclick=saveCustom;}
async function saveCustom(){
 const name=(S._cName||"").trim();if(!name){alert("시험 이름을 입력해주세요.");return;}
 const sc=parseInt(S._cScore,10);if(!(sc>=0&&sc<=100)){alert("원점수를 0~100 사이로 입력해주세요.");return;}
 const wrongs=Object.keys(S._cWrong||{}).filter(n=>S._cWrong[n]).map(Number).sort((a,b)=>a-b);
 const subject=S._cSub||S.profile.subject;const date=S._cDate||"";
 const btn=el("csub");if(btn){btn.disabled=true;btn.textContent="저장 중...";}
 const examCode=("자유:"+name).slice(0,40);
 S.attempt=((LS.get("ds_subs")||[]).filter(x=>x.phone===S.phone&&x.exam===examCode).length)+1;
 const responses=[{item_no:0,area:null,unit:null,my_answer:"",correct_answer:"",result:"o",reason:null,confidence:null,memo:`[직접입력] 과목:${subject} · 날짜:${date} · 시험:${name}`}].concat(wrongs.map(w=>({item_no:w,area:null,unit:null,my_answer:"",correct_answer:"",result:"x",reason:null,confidence:null,memo:null})));
 const res={score:sc,total:0,correct:0,responses};
 let mode="demo";try{mode=await saveAll(res,examCode);}catch(e){mode="error:"+(e&&e.message||e);}
 S.saveMode=mode;S._cWrongList=wrongs;S._cSaved={name,date,subject,score:sc};S.screen="cdone";render();window.scrollTo(0,0);}
function customResult(){
 const d=S._cSaved||{};const wrongs=S._cWrongList||[];const np=S.photo?Object.keys(S.photo).length:0;const pf=(S._photoFailed||[]);
 const savedUI=S.saveMode==="server"?`<div class="saved">델타스킬 서버에 저장됐어요 · 이력이 쌓여 분석에 쓰여요</div>`:(S.saveMode&&(""+S.saveMode).indexOf("error")===0?`<div class="saved demo">서버 저장 실패(${esc(S.saveMode)}) — 브라우저에 임시 저장됨</div>`:`<div class="saved demo">저장 완료(데모=브라우저)</div>`);
 el("screen").innerHTML=`<div class="pad">${savedUI}<div class="h">기록 완료</div>
 <div class="desc">${esc(d.name)} · ${esc(d.date)} · ${esc(d.subject)}</div>
 <div class="kpirow"><div class="kpi"><div class="v">${d.score??0}<span style="font-size:14px;color:var(--mut2)">점</span></div><div class="l">원점수 (100)</div></div><div class="kpi"><div class="v">${wrongs.length}<span style="font-size:14px;color:var(--mut2)">문항</span></div><div class="l">틀린 문항</div></div></div>
 ${wrongs.length?`<div class="bar"><h4>다시 풀 문항</h4><div class="rchips">${wrongs.map(n=>`<span class="rchip">${n}번</span>`).join("")}</div>${np?`<div style="font-size:12px;color:var(--mut);margin-top:8px">오답 사진 ${np}장 첨부${pf.length?` · ${pf.length}장 실패`:''}</div>`:''}</div>`:`<div class="bar"><div class="pl"><span class="ic">🎉</span><div>틀린 문항이 없네요! 기록만 저장했어요.</div></div></div>`}
 <div class="bar"><div class="pl"><span class="ic">📌</span><div><b>단원별 약점·예상등급</b>은 프리셋 시험(기출·메가 등)에서 자동으로 나와요. 직접입력은 점수·오답 이력 기록용이에요.</div></div></div>
 <div class="note">파일럿 · deltaskill.co.kr</div></div>`;
 el("fab").innerHTML=`<button class="btn ghost" id="home">완료 · 처음으로</button>`;el("home").onclick=()=>{S={screen:"login",phone:"",profile:null,studentId:null,catSel:null,ans:{},reason:{},conf:{},memo:{},step:{},photo:{},previewPath:false,attempt:1,saveMode:null};render();window.scrollTo(0,0);};}
/* ---------- 브라우저 뒤로가기: 앱 내 화면 이동으로 처리 ---------- */
let HB=false;
function backable(){return S.screen==="signup"||S.screen==="quiz"||S.screen==="intro"||S.screen==="result"||S.screen==="custom"||S.screen==="cdone"||(S.screen==="exam"&&S.catSel!=null);}
function goBack(){
 if(S.screen==="custom"){S.screen="exam";S.catSel=null;return true;}
 if(S.screen==="cdone"){S.screen="exam";S.catSel=null;return true;}
 if(S.screen==="signup"){S.screen="login";return true;}
 if(S.screen==="quiz"){S.screen="intro";return true;}
 if(S.screen==="intro"){S.screen="exam";return true;}
 if(S.screen==="result"){S.ans={};S.reason={};S.conf={};S.memo={};S.step={};S.photo={};S.previewPath=false;S.saveMode=null;S.screen="exam";return true;}
 if(S.screen==="exam"&&S.catSel!=null){S.catSel=null;return true;}
 return false;}
function syncHist(){if(backable()&&!HB){try{history.pushState({ds:1},"");HB=true;}catch(e){}}}
window.addEventListener("popstate",e=>{
 if(e.state&&e.state.ds===1){HB=true;return;}
 HB=false;
 if(goBack()){render();window.scrollTo(0,0);}
});
try{history.replaceState({ds:0},"");}catch(e){}
render();
</script></body></html>
