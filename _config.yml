# GitHub Pages(Jekyll) 빌드 설정 — 1006 밤 본부
# 왜: Jekyll 이 리포의 CLAUDE.md 를 /CLAUDE.html 로 바꿔 라이브 도메인에 올리고 있었다(내부 운영 문서 · 타사 이름 포함).
#     아래 목록은 사이트에 올리지 않는다. 밑줄로 시작하는 폴더(_dev)는 Jekyll 기본값으로 이미 제외된다.
exclude:
  - CLAUDE.md
  - _dev
  - pilot/README.md
  - package.json
  - package-lock.json
  - node_modules
  - .claude
  - .gitignore
